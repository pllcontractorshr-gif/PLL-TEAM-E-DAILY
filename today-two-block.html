<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLL E TEAM COSTA APP</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="legacy.html?v=three-block-23"></iframe><script>
const frame=document.getElementById('app'),KEY='pll_daily_app_v3',OFFKEY='pll_offline_picker_v1';let w,d,timer;
const hhmm=v=>{if(v===''||v==null)return null;let n=parseInt(v,10),h=Math.floor(n/100),m=n%100;return(h<0||h>23||m<0||m>59)?null:h*60+m};
function seg(q,r,s,f,b){q=parseFloat(q);r=parseFloat(r);s=hhmm(s);f=hhmm(f);let net=null,earn=null;if(s!==null&&f!==null){let x=f-s;if(x<0)x+=1440;net=(x-(+b||0))/60;if(net<=0)net=null}if(Number.isFinite(q)&&Number.isFinite(r))earn=q*r;return{net,earn,s,f}}
function calc3(r){let a=seg(r.qty,r.rate,r.start,r.finish,(+r.pre||0)+(+r.smoko||0)+(+r.movement||0)+(+r.unpaid||0));let h2=r.block2||r.qty2||r.start2||r.finish2,b2=(r.paybreak2!==''&&r.paybreak2!=null?(+r.paybreak2||0):(+r.pre2||0)+(+r.smoko2||0))+(+r.unpaid2||0),b=h2?seg(r.qty2,r.rate2,r.start2,r.finish2,b2):{net:null,earn:null};let h3=r.block3||r.qty3||r.start3||r.finish3,b3=(+r.paybreak3||0)+(+r.unpaid3||0),c=h3?seg(r.qty3,r.rate3,r.start3,r.finish3,b3):{net:null,earn:null};let net=(a.net||0)+(b.net||0)+(c.net||0),earn=(a.earn||0)+(b.earn||0)+(c.earn||0);if(!a.net&&!b.net&&!c.net)net=null;if(a.earn==null&&b.earn==null&&c.earn==null)earn=null;return{net,earn,hr:net&&earn!=null?earn/net:null,s1:a,s2:b,s3:c,has2:!!h2,has3:!!h3}}
function fire(x){x?.dispatchEvent(new Event('input',{bubbles:true}));x?.dispatchEvent(new Event('change',{bubbles:true}))}
function save(){clearTimeout(timer);timer=setTimeout(()=>d.getElementById('saveDay')?.click(),500)}
function store(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function date(){return d.getElementById('workDate')?.value||new Date().toISOString().slice(0,10)}
function rowRecord(tr){let emp=w.allEmployees().find(e=>e.id===tr.dataset.id),day=store()[date()]||{},r=Object.assign(w.blank(emp||{id:tr.dataset.id,name:''}),day[tr.dataset.id]||{});tr.querySelectorAll('input[data-k]').forEach(i=>r[i.dataset.k]=i.value);return r}
function style(){if(d.getElementById('v23style'))return;let s=d.createElement('style');s.id='v23style';s.textContent=`html,body{max-width:100%!important;overflow-x:hidden!important}.wrap{max-width:100%!important;overflow-x:hidden!important}.tablewrap{width:100%!important;max-width:100vw!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}.t31,.t32{display:none!important}.t29,.t30{display:table-cell!important;min-width:105px!important;font-weight:800!important}.blk3{background:#fffaf2!important}.blk3 input[data-k=block3]{min-width:135px!important}.offlineBtn{border:0;border-radius:999px;padding:4px 7px;margin-left:5px;font-size:10px;font-weight:800}.offlineRow{opacity:.45}.threeTools{margin-top:10px;padding:10px;border:1px solid #f4c27a;border-radius:12px;background:#fff7e8}.threeToolsTitle{font-size:16px;font-weight:900;margin-bottom:4px}.threeHint{font-size:12px;color:#6b7280;margin-top:4px}.threeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.blk3Label{display:inline-block;background:#f28c28;color:#fff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}@media(max-width:700px){.threeGrid{grid-template-columns:1fr 1fr}.threeGrid .wide{grid-column:1/-1}#dailyTable td.name{min-width:145px!important;max-width:145px!important;white-space:normal!important}.threeTools{margin-top:8px}.threeTools input{font-size:15px!important}}`;d.head.appendChild(s)}
function addHead(){let tr=d.querySelector('#dailyTable thead tr');if(!tr||tr.querySelector('.hblk3'))return;let heads=[['→ BLK3','hblk3'],['PATCH / BLOCK',''],['BIN QTY [BLK3]',''],['BIN RATE [BLK3]',''],['PAY BREAK',''],['UNPAID BREAK',''],['START TIME',''],['FINISH TIME','']];let before=[...tr.children].find(x=>x.textContent.trim()==='Total Net Hrs');if(!before)return;heads.forEach(([txt,cl])=>{let th=d.createElement('th');th.textContent=txt;th.className='blk3 '+cl;tr.insertBefore(th,before)})}
function tdInput(tr,key,ph=''){let td=d.createElement('td');td.className='blk3';let i=d.createElement('input');i.dataset.k=key;i.placeholder=ph;i.inputMode=(key.includes('block')?'text':'decimal');td.appendChild(i);i.addEventListener('input',()=>{recalc(tr);save()});return td}
function addRows(){let day=store()[date()]||{};d.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{if(tr.querySelector('[data-k="qty3"]'))return;let before=tr.querySelector('.net');if(!before)return;let vals=day[tr.dataset.id]||{},cells=[];let mark=d.createElement('td');mark.className='blk3';mark.innerHTML='<button type="button" class="action secondary" style="padding:7px;white-space:nowrap">→ BLK3</button>';mark.querySelector('button').onclick=()=>{let st=tr.querySelector('[data-k="start3"]'),f2=tr.querySelector('[data-k="finish2"]'),b3=tr.querySelector('[data-k="block3"]');if(st&&!st.value&&f2?.value){st.value=f2.value;fire(st)}if(b3&&!b3.value)b3.focus();(b3||st)?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});save()};cells.push(mark);[['block3','3rd Block / Patch'],['qty3','BIN'],['rate3','$/BIN'],['paybreak3','Paid min'],['unpaid3','Unpaid min'],['start3','HHMM'],['finish3','HHMM']].forEach(([k,p])=>cells.push(tdInput(tr,k,p)));cells.forEach(c=>tr.insertBefore(c,before));tr.querySelectorAll('.blk3 input[data-k]').forEach(i=>{i.value=vals[i.dataset.k]??''});recalc(tr)})}
function recalc(tr){if(tr.classList.contains('offlineRow'))return;let r=rowRecord(tr),c=calc3(r),net=tr.querySelector('.net'),earn=tr.querySelector('.earn'),hr=tr.querySelector('.hr');if(net)net.textContent=c.net?c.net.toFixed(2):'';if(earn)earn.textContent=c.earn!=null?'$'+c.earn.toFixed(2):'';if(hr)hr.textContent=c.hr?'$'+c.hr.toFixed(2):'';let top=tr.querySelector('.t29'),adv=tr.querySelector('.t30');if(top)top.textContent=c.net&&c.earn!=null?'$'+Math.max(0,33.05*c.net-c.earn).toFixed(2):'';if(adv){adv.textContent='';if(c.hr&&c.hr<30){let lastStart=c.has3?hhmm(r.start3):(c.has2?hhmm(r.start2):hhmm(r.start));if(lastStart!==null){let fixed=c.has3?(c.s1.net||0)+(c.s2.net||0):(c.has2?(c.s1.net||0):0),need=Math.max(0,c.earn/30-fixed),br=c.has3?((+r.paybreak3||0)+(+r.unpaid3||0)):(c.has2?((+r.paybreak2||0)+(+r.unpaid2||0)):((+r.pre||0)+(+r.smoko||0)+(+r.unpaid||0)));adv.textContent=w.clock(lastStart+Math.max(0,Math.round(need*60+br)-1))}}}}
function patchFinal(){let th=[...d.querySelectorAll('#dailyTable thead th')],a=th.find(x=>x.textContent.trim()==='$29 Finish'||x.textContent.trim()==='TOPUP'),b=th.find(x=>x.textContent.trim()==='$30 Finish'||x.textContent.trim()==='ADVISE TIME >$30');if(a)a.textContent='TOPUP';if(b)b.textContent='ADVISE TIME >$30';th.filter(x=>['$31 Finish','$32 Finish'].includes(x.textContent.trim())).forEach(x=>x.style.display='none');d.querySelectorAll('#dailyTable tbody tr').forEach(recalc)}
function apply(k,v){if(v==='')return;d.querySelectorAll('#dailyTable tbody tr:not(.offlineRow) [data-k="'+k+'"]').forEach(i=>{i.value=v;fire(i)})}
function tools(){if(d.getElementById('threeTools'))return;let card=d.querySelector('#daily .card');if(!card)return;let x=d.createElement('div');x.id='threeTools';x.className='threeTools';x.innerHTML=`<div class="threeToolsTitle">3 BLOCK SETTINGS</div><div class="threeHint">Fill the rates used today. BLK3 is only for workers who actually move to a third block.</div><div class="threeGrid" style="margin-top:8px"><div><label>BLK1 RATE ($/BIN)</label><input id="r1" type="number" placeholder="e.g. 120"></div><div><label>BLK2 RATE ($/BIN)</label><input id="r2" type="number" placeholder="e.g. 33"></div><div><label>BLK3 RATE ($/BIN)</label><input id="r3" type="number" placeholder="e.g. 30"></div></div><button id="rates" class="action wide" style="width:100%;margin-top:7px">Apply 3 Rates to All</button><div class="threeGrid" style="margin-top:8px"><div><label>BLK3 PAY BREAK (min)</label><input id="p3" type="number" placeholder="e.g. 3"></div><div><label>BLK3 UNPAID (min)</label><input id="u3" type="number" placeholder="e.g. 30"></div><div class="wide"><span class="blk3Label">BLK3 PATCH/BLOCK is entered per picker below</span></div></div><button id="break3" class="action secondary" style="width:100%;margin-top:7px">Apply BLK3 Breaks</button><p class="small"><b>Only 2 blocks?</b> Leave BLK3 blank. <b>Going to a third block?</b> Press → BLK3, then enter PATCH/BLOCK, BIN QTY, RATE and times. BLK3 Start copies BLK2 Finish automatically.</p>`;card.appendChild(x);d.getElementById('rates').onclick=()=>{apply('rate',d.getElementById('r1').value);apply('rate2',d.getElementById('r2').value);apply('rate3',d.getElementById('r3').value);save()};d.getElementById('break3').onclick=()=>{apply('paybreak3',d.getElementById('p3').value);apply('unpaid3',d.getElementById('u3').value);save()}}
function offline(){let os;try{os=JSON.parse(localStorage.getItem(OFFKEY)||'{}')}catch(e){os={}}let od=os[date()]||{};d.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{let cell=tr.querySelector('td.name');if(!cell||cell.querySelector('.offlineBtn'))return;let b=d.createElement('button');b.className='offlineBtn';b.textContent=od[tr.dataset.id]?.offline?'OFFLINE':'SICK / OFFLINE';if(od[tr.dataset.id]?.offline)tr.classList.add('offlineRow');b.onclick=()=>{os[date()]=os[date()]||{};let on=!tr.classList.contains('offlineRow');tr.classList.toggle('offlineRow',on);if(on)os[date()][tr.dataset.id]={offline:true};else delete os[date()][tr.dataset.id];localStorage.setItem(OFFKEY,JSON.stringify(os));b.textContent=on?'OFFLINE':'SICK / OFFLINE'};cell.appendChild(b)})}
function enhance(){try{w=frame.contentWindow;d=frame.contentDocument;if(!d?.body)return setTimeout(enhance,300);d.querySelector('header').textContent='PLL E TEAM COSTA APP';style();tools();addHead();addRows();offline();patchFinal();let tb=d.getElementById('dailyTable');tb.addEventListener('input',e=>{if(e.target.matches('input[data-k]')){recalc(e.target.closest('tr'));save()}});d.getElementById('saveDay')?.addEventListener('click',()=>setTimeout(()=>{addHead();addRows();offline();patchFinal()},100));d.getElementById('workDate')?.addEventListener('change',()=>setTimeout(()=>{addHead();addRows();offline();patchFinal()},150));let n=0,id=setInterval(()=>{addHead();addRows();offline();patchFinal();if(++n>10)clearInterval(id)},400)}catch(e){console.error(e)}}
frame.addEventListener('load',()=>setTimeout(enhance,250));
</script></body></html>
