<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PLL E TEAM COSTA APP</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="legacy.html?v=two-block-19" title="PLL E TEAM COSTA APP"></iframe><script>
const frame=document.getElementById('app');let w,d;
function hhmm(v){if(v===''||v==null)return null;let n=parseInt(v,10),h=Math.floor(n/100),m=n%100;if(h<0||h>23||m<0||m>59)return null;return h*60+m}
function elapsed(a,b){let s=hhmm(a),f=hhmm(b);if(s===null||f===null)return null;let m=f-s;if(m<0)m+=1440;return m}
function fire(el){if(!el)return;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
function applyAll(key,value){if(value==='')return;d.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{const x=tr.querySelector('[data-k="'+key+'"]');if(x){x.value=value;fire(x)}})}
function minusOneMinute(txt){const m=(txt||'').match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return'';const h=(+m[1])%12+(m[3].toUpperCase()==='PM'?12:0);return w.clock(h*60+(+m[2])-1)}
function addStyle(){if(d.getElementById('twoBlockFinalStyle'))return;const s=d.createElement('style');s.id='twoBlockFinalStyle';s.textContent=`.t31,.t32{display:none!important}.t29,.t30{display:table-cell!important;min-width:108px!important;white-space:nowrap!important;font-weight:800!important;background:#fafafa!important}.finalGood{color:#128a35!important;font-weight:800!important}.finalBad{color:#d11a2a!important;font-weight:800!important}@media(max-width:700px){#dailyTable td.name{width:135px!important;min-width:135px!important;max-width:135px!important;white-space:normal!important;word-break:break-word!important}}`;d.head.appendChild(s)}
function patchFinalColumns(){if(!d||!w)return;addStyle();const table=d.getElementById('dailyTable');if(!table)return;const head=table.querySelector('thead tr');if(!head)return;const ths=[...head.children];const avg=ths.find(x=>['Avg $/Hr','AVE $/HR'].includes(x.textContent.trim()));if(avg)avg.textContent='AVE $/HR';const h29=ths.find(x=>x.textContent.trim()==='$29 Finish'||x.textContent.trim()==='TOPUP');const h30=ths.find(x=>x.textContent.trim()==='$30 Finish'||x.textContent.trim()==='ADVISE TIME >$30');const h31=ths.find(x=>x.textContent.trim()==='$31 Finish'),h32=ths.find(x=>x.textContent.trim()==='$32 Finish');if(h29)h29.textContent='TOPUP';if(h30)h30.textContent='ADVISE TIME >$30';if(h31)h31.style.display='none';if(h32)h32.style.display='none';table.querySelectorAll('tbody tr').forEach(tr=>{const net=parseFloat((tr.querySelector('.net')?.textContent||'').replace(/[^0-9.-]/g,'')),earn=parseFloat((tr.querySelector('.earn')?.textContent||'').replace(/[^0-9.-]/g,'')),hrVal=parseFloat((tr.querySelector('.hr')?.textContent||'').replace(/[^0-9.-]/g,''));const c29=tr.querySelector('.t29'),c30=tr.querySelector('.t30'),c31=tr.querySelector('.t31'),c32=tr.querySelector('.t32');if(c31)c31.style.display='none';if(c32)c32.style.display='none';const top=(Number.isFinite(net)&&Number.isFinite(earn))?Math.max(0,33.05*net-earn):null;if(c29)c29.textContent=top==null?'':('$'+top.toFixed(2));let advise='';try{const emp=w.allEmployees().find(x=>x.id===tr.dataset.id);if(emp&&Number.isFinite(hrVal)&&hrVal<30){const day=(JSON.parse(localStorage.getItem('pll_daily_app_v3')||'{}'))[d.getElementById('workDate').value]||{};const r=Object.assign(w.blank(emp),day[emp.id]||{});tr.querySelectorAll('input[data-k]').forEach(i=>r[i.dataset.k]=i.value);advise=minusOneMinute(w.target(r,30))}}catch(e){}if(c30)c30.textContent=advise;const h=tr.querySelector('.hr');if(h){h.classList.remove('finalGood','finalBad');if(Number.isFinite(hrVal))h.classList.add(hrVal<30?'finalBad':'finalGood')}})}
function burst(){let n=0;const id=setInterval(()=>{patchFinalColumns();if(++n>=12)clearInterval(id)},400)}
function addTools(){if(!d||d.getElementById('twoBlockTools'))return;const first=d.querySelector('#daily .card');if(!first)return;const box=d.createElement('div');box.id='twoBlockTools';box.style.cssText='margin-top:10px;padding:10px;border:1px solid #f4c27a;border-radius:12px;background:#fff7e8';box.innerHTML=`<div style="font-weight:900;margin-bottom:8px">TWO BLOCK SETTINGS</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>BLK1 BIN RATE ($)</label><input id="rate1All" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 120"></div><div><label>BLK2 BIN RATE ($)</label><input id="rate2All" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 135"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button id="applyRates" class="action" type="button">Apply Rates to All</button><button id="copyRate" class="action secondary" type="button">Copy BLK1 Rate → BLK2</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div><label>BLK2 PAY BREAK (min)</label><input id="pay2All" type="number" inputmode="numeric" min="0" placeholder="e.g. 10"></div><div><label>BLK2 UNPAID (min)</label><input id="unpaid2All" type="number" inputmode="numeric" min="0" placeholder="e.g. 30"></div></div><button id="applyBreaks" class="action" style="width:100%;margin-top:8px" type="button">Apply BLK2 Breaks to All</button><button id="autoUnpaid" class="action secondary" style="width:100%;margin-top:8px" type="button">Auto BLK2 30min if Day ≥ 5hrs</button><div class="small" style="margin-top:7px"><b>BLK1 unpaid stays manual.</b> Auto only adds 30 min to BLK2 when BLK1 unpaid is blank/0 and the picker reaches 5 hours across BLK1 + BLK2.</div>`;first.appendChild(box);
d.getElementById('applyRates').onclick=()=>{applyAll('rate',d.getElementById('rate1All').value);applyAll('rate2',d.getElementById('rate2All').value);setTimeout(()=>{d.getElementById('saveDay')?.click();patchFinalColumns()},180)};
d.getElementById('copyRate').onclick=()=>{let v=d.getElementById('rate1All').value||d.getElementById('defaultRate')?.value||'';if(v===''){alert('Enter BLK1 rate first.');return}d.getElementById('rate2All').value=v;applyAll('rate2',v);setTimeout(()=>{d.getElementById('saveDay')?.click();patchFinalColumns()},180)};
d.getElementById('applyBreaks').onclick=()=>{applyAll('paybreak2',d.getElementById('pay2All').value);applyAll('unpaid2',d.getElementById('unpaid2All').value);setTimeout(()=>{d.getElementById('saveDay')?.click();patchFinalColumns()},180)};
d.getElementById('autoUnpaid').onclick=()=>{let added=0,kept=0,under=0;d.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{let m1=elapsed(tr.querySelector('[data-k="start"]')?.value||'',tr.querySelector('[data-k="finish"]')?.value||''),m2=elapsed(tr.querySelector('[data-k="start2"]')?.value||'',tr.querySelector('[data-k="finish2"]')?.value||''),u1=tr.querySelector('[data-k="unpaid"]'),u2=tr.querySelector('[data-k="unpaid2"]');if(!u2)return;let firstUnpaid=parseFloat(u1?.value||0)||0;if(firstUnpaid>0){kept++;return}if(m1!==null&&m2!==null&&m1+m2>=300){u2.value='30';fire(u2);added++}else{if((u2.value||'')==='30'){u2.value='';fire(u2)}under++}});setTimeout(()=>{d.getElementById('saveDay')?.click();patchFinalColumns()},180);alert('BLK2 30min added: '+added+' | BLK1 manual kept: '+kept+' | Under 5h/incomplete: '+under)};
}
function attach(){try{w=frame.contentWindow;d=frame.contentDocument;if(!d||!d.body){setTimeout(attach,300);return}d.title='PLL E TEAM COSTA APP';const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP';addStyle();addTools();patchFinalColumns();burst();d.getElementById('dailyTable')?.addEventListener('input',()=>setTimeout(patchFinalColumns,80));d.getElementById('dailyTable')?.addEventListener('change',()=>setTimeout(patchFinalColumns,100));d.getElementById('saveDay')?.addEventListener('click',()=>setTimeout(()=>{patchFinalColumns();burst()},180))}catch(e){setTimeout(attach,500)}}
frame.addEventListener('load',()=>setTimeout(attach,300));
</script></body></html>
