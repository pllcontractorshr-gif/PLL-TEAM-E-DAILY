<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PLL E TEAM COSTA APP</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="legacy.html?v=two-block-18" title="PLL E TEAM COSTA APP"></iframe><script>
const frame=document.getElementById('app');let w,d;
function hhmm(v){if(v===''||v==null)return null;let n=parseInt(v,10),h=Math.floor(n/100),m=n%100;if(h<0||h>23||m<0||m>59)return null;return h*60+m}
function elapsed(a,b){let s=hhmm(a),f=hhmm(b);if(s===null||f===null)return null;let m=f-s;if(m<0)m+=1440;return m}
function fire(el){if(!el)return;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
function applyAll(key,value){if(value==='')return;d.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{const x=tr.querySelector('[data-k="'+key+'"]');if(x){x.value=value;fire(x)}})}
function addTools(){if(!d||d.getElementById('twoBlockTools'))return;const first=d.querySelector('#daily .card');if(!first)return;const box=d.createElement('div');box.id='twoBlockTools';box.style.cssText='margin-top:10px;padding:10px;border:1px solid #f4c27a;border-radius:12px;background:#fff7e8';box.innerHTML=`<div style="font-weight:900;margin-bottom:8px">TWO BLOCK SETTINGS</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>BLK1 BIN RATE ($)</label><input id="rate1All" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 120"></div><div><label>BLK2 BIN RATE ($)</label><input id="rate2All" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 135"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button id="applyRates" class="action" type="button">Apply Rates to All</button><button id="copyRate" class="action secondary" type="button">Copy BLK1 Rate → BLK2</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div><label>BLK2 PAY BREAK (min)</label><input id="pay2All" type="number" inputmode="numeric" min="0" placeholder="e.g. 10"></div><div><label>BLK2 UNPAID (min)</label><input id="unpaid2All" type="number" inputmode="numeric" min="0" placeholder="e.g. 30"></div></div><button id="applyBreaks" class="action" style="width:100%;margin-top:8px" type="button">Apply BLK2 Breaks to All</button><button id="autoUnpaid" class="action secondary" style="width:100%;margin-top:8px" type="button">Auto BLK2 30min if Day ≥ 5hrs</button><div class="small" style="margin-top:7px"><b>BLK1 unpaid stays manual.</b> Auto only adds 30 min to BLK2 when BLK1 unpaid is blank/0 and the picker reaches 5 hours across BLK1 + BLK2. It will not double-deduct a break.</div>`;first.appendChild(box);
d.getElementById('applyRates').onclick=()=>{applyAll('rate',d.getElementById('rate1All').value);applyAll('rate2',d.getElementById('rate2All').value);setTimeout(()=>d.getElementById('saveDay')?.click(),150)};
d.getElementById('copyRate').onclick=()=>{let v=d.getElementById('rate1All').value||d.getElementById('defaultRate')?.value||'';if(v===''){alert('Enter BLK1 rate first.');return}d.getElementById('rate2All').value=v;applyAll('rate2',v);setTimeout(()=>d.getElementById('saveDay')?.click(),150)};
d.getElementById('applyBreaks').onclick=()=>{applyAll('paybreak2',d.getElementById('pay2All').value);applyAll('unpaid2',d.getElementById('unpaid2All').value);setTimeout(()=>d.getElementById('saveDay')?.click(),150)};
d.getElementById('autoUnpaid').onclick=()=>{let added=0,kept=0,under=0;d.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{let m1=elapsed(tr.querySelector('[data-k="start"]')?.value||'',tr.querySelector('[data-k="finish"]')?.value||''),m2=elapsed(tr.querySelector('[data-k="start2"]')?.value||'',tr.querySelector('[data-k="finish2"]')?.value||''),u1=tr.querySelector('[data-k="unpaid"]'),u2=tr.querySelector('[data-k="unpaid2"]');if(!u2)return;let firstUnpaid=parseFloat(u1?.value||0)||0;if(firstUnpaid>0){kept++;return}if(m1!==null&&m2!==null&&m1+m2>=300){u2.value='30';fire(u2);added++}else{if((u2.value||'')==='30'){u2.value='';fire(u2)}under++}});setTimeout(()=>d.getElementById('saveDay')?.click(),150);alert('BLK2 30min added: '+added+' | BLK1 manual break kept: '+kept+' | Under 5h/incomplete: '+under)};
}
function attach(){try{w=frame.contentWindow;d=frame.contentDocument;if(!d||!d.body){setTimeout(attach,300);return}d.title='PLL E TEAM COSTA APP';const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP';addTools()}catch(e){setTimeout(attach,500)}}
frame.addEventListener('load',()=>setTimeout(attach,300));
</script></body></html>
