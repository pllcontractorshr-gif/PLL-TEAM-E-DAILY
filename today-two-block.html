<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PLL E TEAM COSTA APP</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="legacy.html?v=two-block-20" title="PLL E TEAM COSTA APP"></iframe><script>
const frame=document.getElementById('app');let w,d,autoSaveTimer=null;const OFFKEY='pll_offline_picker_v1';
function hhmm(v){if(v===''||v==null)return null;let n=parseInt(v,10),h=Math.floor(n/100),m=n%100;if(h<0||h>23||m<0||m>59)return null;return h*60+m}
function elapsed(a,b){let s=hhmm(a),f=hhmm(b);if(s===null||f===null)return null;let m=f-s;if(m<0)m+=1440;return m}
function fire(el){if(!el)return;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
function applyAll(key,value){if(value==='')return;d.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{if(tr.classList.contains('offlineRow'))return;const x=tr.querySelector('[data-k="'+key+'"]');if(x){x.value=value;fire(x)}})}
function minusOneMinute(txt){const m=(txt||'').match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return'';const h=(+m[1])%12+(m[3].toUpperCase()==='PM'?12:0);return w.clock(h*60+(+m[2])-1)}
function addStyle(){if(d.getElementById('twoBlockFinalStyle'))return;const s=d.createElement('style');s.id='twoBlockFinalStyle';s.textContent=`.t31,.t32{display:none!important}.t29,.t30{display:table-cell!important;min-width:108px!important;white-space:nowrap!important;font-weight:800!important;background:#fafafa!important}.finalGood{color:#128a35!important;font-weight:800!important}.finalBad{color:#d11a2a!important;font-weight:800!important}.offlineBtn{border:0;border-radius:999px;padding:5px 8px;margin-left:6px;font-size:10px;font-weight:900;background:#e5e7eb;color:#222}.offlineBtn.on{background:#4b5563;color:#fff}.offlineRow td{background:#f1f3f5!important;color:#7a7f87!important}.offlineRow td.name{color:#555!important}.offlineRow input{background:#eceff1!important;color:#999!important}@media(max-width:700px){#dailyTable td.name{width:155px!important;min-width:155px!important;max-width:155px!important;white-space:normal!important;word-break:break-word!important}.offlineBtn{display:block;margin:4px auto 0}}`;d.head.appendChild(s)}
function patchFinalColumns(){if(!d||!w)return;addStyle();const table=d.getElementById('dailyTable');if(!table)return;const head=table.querySelector('thead tr');if(!head)return;const ths=[...head.children];const avg=ths.find(x=>['Avg $/Hr','AVE $/HR'].includes(x.textContent.trim()));if(avg)avg.textContent='AVE $/HR';const h29=ths.find(x=>x.textContent.trim()==='$29 Finish'||x.textContent.trim()==='TOPUP');const h30=ths.find(x=>x.textContent.trim()==='$30 Finish'||x.textContent.trim()==='ADVISE TIME >$30');const h31=ths.find(x=>x.textContent.trim()==='$31 Finish'),h32=ths.find(x=>x.textContent.trim()==='$32 Finish');if(h29)h29.textContent='TOPUP';if(h30)h30.textContent='ADVISE TIME >$30';if(h31)h31.style.display='none';if(h32)h32.style.display='none';table.querySelectorAll('tbody tr').forEach(tr=>{if(tr.classList.contains('offlineRow')){const c29=tr.querySelector('.t29'),c30=tr.querySelector('.t30');if(c29)c29.textContent='OFFLINE';if(c30)c30.textContent='';return}const net=parseFloat((tr.querySelector('.net')?.textContent||'').replace(/[^0-9.-]/g,'')),earn=parseFloat((tr.querySelector('.earn')?.textContent||'').replace(/[^0-9.-]/g,'')),hrVal=parseFloat((tr.querySelector('.hr')?.textContent||'').replace(/[^0-9.-]/g,''));const c29=tr.querySelector('.t29'),c30=tr.querySelector('.t30'),c31=tr.querySelector('.t31'),c32=tr.querySelector('.t32');if(c31)c31.style.display='none';if(c32)c32.style.display='none';const top=(Number.isFinite(net)&&Number.isFinite(earn))?Math.max(0,33.05*net-earn):null;if(c29)c29.textContent=top==null?'':('$'+top.toFixed(2));let advise='';try{const emp=w.allEmployees().find(x=>x.id===tr.dataset.id);if(emp&&Number.isFinite(hrVal)&&hrVal<30){const day=(JSON.parse(localStorage.getItem('pll_daily_app_v3')||'{}'))[d.getElementById('workDate').value]||{};const r=Object.assign(w.blank(emp),day[emp.id]||{});tr.querySelectorAll('input[data-k]').forEach(i=>r[i.dataset.k]=i.value);advise=minusOneMinute(w.target(r,30))}}catch(e){}if(c30)c30.textContent=advise;const h=tr.querySelector('.hr');if(h){h.classList.remove('finalGood','finalBad');if(Number.isFinite(hrVal))h.classList.add(hrVal<30?'finalBad':'finalGood')}})}
function offStore(){try{return JSON.parse(localStorage.getItem(OFFKEY)||'{}')}catch(e){return{}}}function saveOff(x){localStorage.setItem(OFFKEY,JSON.stringify(x))}function curDate(){return d?.getElementById('workDate')?.value||new Date().toISOString().slice(0,10)}
function rowValues(tr){const v={};tr.querySelectorAll('input[data-k]').forEach(i=>v[i.dataset.k]=i.value);return v}function setRowValues(tr,v){tr.querySelectorAll('input[data-k]').forEach(i=>{i.value=(v&&Object.prototype.hasOwnProperty.call(v,i.dataset.k))?v[i.dataset.k]:'';fire(i)})}
function setOffline(tr,on,restore){const id=tr.dataset.id;if(!id)return;let s=offStore(),dt=curDate();s[dt]=s[dt]||{};if(on){if(!s[dt][id]||!s[dt][id].offline)s[dt][id]={offline:true,values:rowValues(tr)};else s[dt][id].offline=true;saveOff(s);tr.classList.add('offlineRow');tr.querySelectorAll('input[data-k]').forEach(i=>{i.value='';i.disabled=true});}else{const old=s[dt][id];if(restore&&old?.values){tr.querySelectorAll('input[data-k]').forEach(i=>{i.disabled=false;i.value=old.values[i.dataset.k]??'';fire(i)})}else tr.querySelectorAll('input[data-k]').forEach(i=>i.disabled=false);delete s[dt][id];saveOff(s);tr.classList.remove('offlineRow')}const b=tr.querySelector('.offlineBtn');if(b){b.textContent=on?'OFFLINE':'SICK / OFFLINE';b.classList.toggle('on',on)}scheduleAutosave();setTimeout(patchFinalColumns,120)}
function addOfflineButtons(){if(!d)return;const s=offStore(),dt=curDate(),day=s[dt]||{};d.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{const id=tr.dataset.id;if(!id)return;let cell=tr.querySelector('td.name')||tr.children[1]||tr.children[0];if(!cell)return;let b=tr.querySelector('.offlineBtn');if(!b){b=d.createElement('button');b.type='button';b.className='offlineBtn';b.onclick=e=>{e.preventDefault();e.stopPropagation();setOffline(tr,!tr.classList.contains('offlineRow'),true)};cell.appendChild(b)}const on=!!day[id]?.offline;b.textContent=on?'OFFLINE':'SICK / OFFLINE';b.classList.toggle('on',on);if(on){tr.classList.add('offlineRow');tr.querySelectorAll('input[data-k]').forEach(i=>{i.value='';i.disabled=true})}else{tr.classList.remove('offlineRow');tr.querySelectorAll('input[data-k]').forEach(i=>i.disabled=false)}})}
function burst(){let n=0;const id=setInterval(()=>{addOfflineButtons();patchFinalColumns();if(++n>=12)clearInterval(id)},400)}
function scheduleAutosave(){clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(()=>{try{d.getElementById('saveDay')?.click()}catch(e){}},700)}
function addTools(){if(!d||d.getElementById('twoBlockTools'))return;const first=d.querySelector('#daily .card');if(!first)return;const box=d.createElement('div');box.id='twoBlockTools';box.style.cssText='margin-top:10px;padding:10px;border:1px solid #f4c27a;border-radius:12px;background:#fff7e8';box.innerHTML=`<div style="font-weight:900;margin-bottom:8px">TWO BLOCK SETTINGS</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>BLK1 BIN RATE ($)</label><input id="rate1All" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 120"></div><div><label>BLK2 BIN RATE ($)</label><input id="rate2All" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 135"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button id="applyRates" class="action" type="button">Apply Rates to All</button><button id="copyRate" class="action secondary" type="button">Copy BLK1 Rate → BLK2</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div><label>BLK2 PAY BREAK (min)</label><input id="pay2All" type="number" inputmode="numeric" min="0" placeholder="e.g. 10"></div><div><label>BLK2 UNPAID (min)</label><input id="unpaid2All" type="number" inputmode="numeric" min="0" placeholder="e.g. 30"></div></div><button id="applyBreaks" class="action" style="width:100%;margin-top:8px" type="button">Apply BLK2 Breaks to All</button><button id="autoUnpaid" class="action secondary" style="width:100%;margin-top:8px" type="button">Auto BLK2 30min if Day ≥ 5hrs</button><div class="small" style="margin-top:7px"><b>BLK1 unpaid stays manual.</b> Changes now auto-save. Use SICK / OFFLINE beside a picker to exclude them for the day.</div>`;first.appendChild(box);
d.getElementById('applyRates').onclick=()=>{applyAll('rate',d.getElementById('rate1All').value);applyAll('rate2',d.getElementById('rate2All').value);scheduleAutosave()};d.getElementById('copyRate').onclick=()=>{let v=d.getElementById('rate1All').value||d.getElementById('defaultRate')?.value||'';if(v===''){alert('Enter BLK1 rate first.');return}d.getElementById('rate2All').value=v;applyAll('rate2',v);scheduleAutosave()};d.getElementById('applyBreaks').onclick=()=>{applyAll('paybreak2',d.getElementById('pay2All').value);applyAll('unpaid2',d.getElementById('unpaid2All').value);scheduleAutosave()};d.getElementById('autoUnpaid').onclick=()=>{let added=0,kept=0,under=0;d.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{if(tr.classList.contains('offlineRow'))return;let m1=elapsed(tr.querySelector('[data-k="start"]')?.value||'',tr.querySelector('[data-k="finish"]')?.value||''),m2=elapsed(tr.querySelector('[data-k="start2"]')?.value||'',tr.querySelector('[data-k="finish2"]')?.value||''),u1=tr.querySelector('[data-k="unpaid"]'),u2=tr.querySelector('[data-k="unpaid2"]');if(!u2)return;let firstUnpaid=parseFloat(u1?.value||0)||0;if(firstUnpaid>0){kept++;return}if(m1!==null&&m2!==null&&m1+m2>=300){u2.value='30';fire(u2);added++}else{if((u2.value||'')==='30'){u2.value='';fire(u2)}under++}});scheduleAutosave();alert('BLK2 30min added: '+added+' | BLK1 manual kept: '+kept+' | Under 5h/incomplete: '+under)};}
function attach(){try{w=frame.contentWindow;d=frame.contentDocument;if(!d||!d.body){setTimeout(attach,300);return}d.title='PLL E TEAM COSTA APP';const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP';addStyle();addTools();addOfflineButtons();patchFinalColumns();burst();const table=d.getElementById('dailyTable');table?.addEventListener('input',()=>{scheduleAutosave();setTimeout(()=>{addOfflineButtons();patchFinalColumns()},80)});table?.addEventListener('change',()=>{scheduleAutosave();setTimeout(()=>{addOfflineButtons();patchFinalColumns()},100)});d.getElementById('workDate')?.addEventListener('change',()=>setTimeout(()=>{addOfflineButtons();patchFinalColumns();burst()},180));d.getElementById('saveDay')?.addEventListener('click',()=>setTimeout(()=>{addOfflineButtons();patchFinalColumns();burst()},180));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')try{d.getElementById('saveDay')?.click()}catch(e){}});window.addEventListener('beforeunload',()=>{try{d.getElementById('saveDay')?.click()}catch(e){}})}catch(e){setTimeout(attach,500)}}
frame.addEventListener('load',()=>setTimeout(attach,300));
</script></body></html>
