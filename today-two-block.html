<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PLL E TEAM COSTA APP</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#shell{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="shell" src="index.html?v=15"></iframe><script>
const shell=document.getElementById('shell');let outer,legacy,doc;
function hhmm(v){if(v===''||v==null)return null;let n=parseInt(v,10),h=Math.floor(n/100),m=n%100;if(h<0||h>23||m<0||m>59)return null;return h*60+m}
function elapsed(a,b){let s=hhmm(a),f=hhmm(b);if(s===null||f===null)return null;let m=f-s;if(m<0)m+=1440;return m}
function fire(el){el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
function addControls(){if(!doc||doc.getElementById('twoBlockTools'))return;const daily=doc.querySelector('#daily .card');if(!daily)return;const box=doc.createElement('div');box.id='twoBlockTools';box.style.cssText='margin-top:10px;padding:10px;border:1px solid #f4c27a;border-radius:12px;background:#fff7e8';box.innerHTML=`<div style="font-weight:800;margin-bottom:8px">TODAY — TWO BLOCK SETTINGS</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><div><label>BLK2 BIN RATE ($)</label><input id="allRate2" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 135"></div><div><label>BLK2 PAY BREAK (min)</label><input id="allPay2" type="number" inputmode="numeric" placeholder="e.g. 10"></div></div><button id="applyTwoBlock" class="action" style="width:100%;margin-top:8px" type="button">Apply BLK2 Rate / Pay Break to All</button><button id="applyFiveHour" class="action secondary" style="width:100%;margin-top:8px" type="button">AUTO 30 MIN UNPAID — 5 HOUR RULE</button><div class="small" style="margin-top:7px">BLK1 uses Default BIN Rate above. BLK2 can use a different BIN rate. 30 min unpaid is placed in BLK1 only if BLK1 reaches 5 hours; otherwise it is placed in BLK2 when BLK1 + BLK2 reaches 5 hours. Pickers under 5 hours get no 30 min unpaid break.</div>`;daily.appendChild(box);
doc.getElementById('applyTwoBlock').onclick=()=>{let rate=doc.getElementById('allRate2').value,pay=doc.getElementById('allPay2').value;if(rate===''&&pay===''){alert('Enter BLK2 BIN RATE or PAY BREAK first.');return}doc.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{let r=tr.querySelector('[data-k=rate2]'),p=tr.querySelector('[data-k=paybreak2]');if(rate!==''&&r){r.value=rate;fire(r)}if(pay!==''&&p){p.value=pay;fire(p)}});doc.getElementById('saveDay')?.click();alert('BLK2 settings applied to all pickers.');};
doc.getElementById('applyFiveHour').onclick=()=>{let a=0,b=0,n=0;doc.querySelectorAll('#dailyTable tbody tr').forEach(tr=>{let m1=elapsed(tr.querySelector('[data-k=start]')?.value||'',tr.querySelector('[data-k=finish]')?.value||''),m2=elapsed(tr.querySelector('[data-k=start2]')?.value||'',tr.querySelector('[data-k=finish2]')?.value||''),u1=tr.querySelector('[data-k=unpaid]'),u2=tr.querySelector('[data-k=unpaid2]');if(!u1||!u2)return;if(m1!==null&&m1>=300){u1.value='30';u2.value='';a++}else if(m1!==null&&m2!==null&&m1+m2>=300){u1.value='';u2.value='30';b++}else{u1.value='';u2.value='';n++}fire(u1);fire(u2)});doc.getElementById('saveDay')?.click();alert('5-hour rule applied. BLK1: '+a+' picker(s), BLK2: '+b+' picker(s), under 5h: '+n+' picker(s).');};}
function attach(){try{outer=shell.contentWindow;let app=outer.document.getElementById('app');if(!app){setTimeout(attach,300);return}legacy=app.contentWindow;doc=app.contentDocument;if(!doc||!doc.body){setTimeout(attach,300);return}addControls();outer.document.title='PLL E TEAM COSTA APP';setInterval(addControls,3000)}catch(e){setTimeout(attach,500)}}
shell.addEventListener('load',()=>setTimeout(attach,400));
</script></body></html>
