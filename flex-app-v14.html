<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLL E TEAM COSTA APP — FLEX v14</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" src="flex-app-v12.html?v=14" title="PLL E TEAM COSTA APP FLEX"></iframe>
<script>
const outer=document.getElementById('app');let d=null,t=null;
function deepest(){try{let doc=outer.contentDocument;for(let i=0;i<14;i++){const f=doc?.querySelector('iframe#app,iframe');if(!f||!f.contentDocument||f.contentDocument===doc)break;doc=f.contentDocument}return doc}catch(e){return null}}
function numText(v){const m=String(v||'').replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);return m?parseFloat(m[0]):null}
function style(){if(d.getElementById('v14style'))return;const s=d.createElement('style');s.id='v14style';s.textContent=`
.seg{display:grid!important;grid-template-columns:1.35fr .55fr .55fr .68fr .55fr .65fr .65fr auto!important;gap:6px!important;align-items:end!important}.seg>div{min-width:0}.seg label{min-height:24px;display:flex!important;align-items:flex-end!important;line-height:1.05!important}.segUnpaidWrap{align-self:stretch!important;display:flex!important;flex-direction:column!important;justify-content:flex-end!important}.segUnpaidWrap label{min-height:24px!important}.movement,.blockUnpaid,.start,.finish{height:38px!important}
.sortBar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0 10px}.sortBar b{font-size:12px}.sortBtn{border:0;border-radius:9px;padding:9px 11px;font-weight:900;background:#e5e7eb;color:#111;cursor:pointer}.sortBtn.active{background:#f28c28;color:#fff}
@media(max-width:700px){.seg{grid-template-columns:1fr 1fr 1fr!important}.seg .wide{grid-column:1/-1!important}.seg label{min-height:auto!important}.sortBar{position:sticky;top:104px;z-index:20;background:#fff;padding:6px;border-radius:10px;box-shadow:0 1px 6px #0001}.sortBtn{font-size:12px;padding:8px 9px}}
`;d.head.appendChild(s)}
function mark(view,dir){d.querySelectorAll(`[data-sort-view="${view}"] .sortBtn`).forEach(b=>b.classList.toggle('active',b.dataset.dir===dir))}
function sortDaily(dir){const box=d.getElementById('workers');if(!box)return;const rows=[...box.querySelectorAll('.worker')];rows.sort((a,b)=>{const av=numText(a.querySelector('.sumA')?.textContent),bv=numText(b.querySelector('.sumA')?.textContent);if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;return dir==='asc'?av-bv:bv-av});rows.forEach(r=>box.appendChild(r));mark('daily',dir)}
function sortHistory(dir){const box=d.getElementById('historyBox');if(!box)return;const rows=[...box.querySelectorAll('.historyRow:not(.head)')];rows.sort((a,b)=>{const av=numText(a.lastElementChild?.textContent),bv=numText(b.lastElementChild?.textContent);if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;return dir==='asc'?av-bv:bv-av});rows.forEach(r=>box.appendChild(r));mark('history',dir)}
function sortWeekly(dir){const body=d.querySelector('#weekBox table.weektable tbody');if(!body)return;const rows=[...body.querySelectorAll('tr')];rows.sort((a,b)=>{const av=numText(a.lastElementChild?.textContent),bv=numText(b.lastElementChild?.textContent);if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;return dir==='asc'?av-bv:bv-av});rows.forEach(r=>body.appendChild(r));mark('weekly',dir)}
function addBar(view){const sec=d.getElementById(view);if(!sec||sec.querySelector(`[data-sort-view="${view}"]`))return;const first=sec.querySelector('.card');if(!first)return;const bar=d.createElement('div');bar.className='card sortBar';bar.dataset.sortView=view;bar.innerHTML='<b>SORT AVG $/HR</b><button class="sortBtn" data-dir="asc">Low → High</button><button class="sortBtn" data-dir="desc">High → Low</button>';first.insertAdjacentElement('afterend',bar);bar.querySelector('[data-dir="asc"]').onclick=()=>view==='daily'?sortDaily('asc'):view==='history'?sortHistory('asc'):sortWeekly('asc');bar.querySelector('[data-dir="desc"]').onclick=()=>view==='daily'?sortDaily('desc'):view==='history'?sortHistory('desc'):sortWeekly('desc')}
function hook(){const h=d.getElementById('showHistory'),w=d.getElementById('showWeek');if(h&&!h.dataset.v14){h.dataset.v14='1';h.addEventListener('click',()=>setTimeout(()=>{const a=d.querySelector('[data-sort-view="history"] .sortBtn.active');if(a)sortHistory(a.dataset.dir)},250))}if(w&&!w.dataset.v14){w.dataset.v14='1';w.addEventListener('click',()=>setTimeout(()=>{const a=d.querySelector('[data-sort-view="weekly"] .sortBtn.active');if(a)sortWeekly(a.dataset.dir)},250))}}
function refresh(){d=deepest();if(!d?.body)return;style();addBar('daily');addBar('history');addBar('weekly');hook();const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP — FLEX v14'}
function enhance(){refresh();if(!d?.body){setTimeout(enhance,250);return}if(!d.body.dataset.v14){d.body.dataset.v14='1';new MutationObserver(()=>{clearTimeout(t);t=setTimeout(refresh,60)}).observe(d.body,{childList:true,subtree:true})}let n=0;const id=setInterval(()=>{refresh();if(++n>30)clearInterval(id)},300)}
outer.addEventListener('load',()=>setTimeout(enhance,500));setTimeout(enhance,1000);
</script></body></html>
