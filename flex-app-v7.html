<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLL E TEAM COSTA APP — FLEX v7</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" src="flex-app-v6.html?v=7" title="PLL E TEAM COSTA APP FLEX"></iframe>
<script>
const frame=document.getElementById('app');let d=null,lastAddId='',lastAddUntil=0;
function fire(el,type='input'){if(el)el.dispatchEvent(new Event(type,{bubbles:true}))}
function applyStartDOM(){
  if(!d)return;
  const c=d.getElementById('commonStart');
  const v=(c?.value||'').trim();
  if(!/^\d{3,4}$/.test(v))return;
  d.querySelectorAll('.worker:not(.offline)').forEach(worker=>{
    const start=worker.querySelector('.seg .start');
    if(start){start.value=v;fire(start,'input');fire(start,'change')}
  });
}
function patchStart(){
  const c=d?.getElementById('commonStart'),b=d?.getElementById('applyStart');
  if(!c||!b||c.dataset.v7)return;
  c.dataset.v7='1';
  b.addEventListener('click',()=>setTimeout(applyStartDOM,20),true);
  c.addEventListener('change',applyStartDOM);
  c.addEventListener('blur',applyStartDOM);
  c.addEventListener('input',()=>{clearTimeout(c._v7t);c._v7t=setTimeout(()=>{if((c.value||'').trim().length>=3)applyStartDOM()},250)});
}
function reopenWorker(){
  if(!d||!lastAddId||Date.now()>lastAddUntil)return;
  const el=d.querySelector('.worker[data-id="'+CSS.escape(lastAddId)+'"]');
  if(el){el.open=true;const segs=el.querySelectorAll('.seg');const last=segs[segs.length-1];if(last)last.scrollIntoView({block:'center'})}
}
function patchAdd(){
  if(!d||d.body.dataset.v7add)return;d.body.dataset.v7add='1';
  d.addEventListener('click',e=>{const btn=e.target.closest?.('.addSeg');if(!btn)return;const w=btn.closest('.worker');if(!w)return;lastAddId=w.dataset.id;lastAddUntil=Date.now()+1800;setTimeout(reopenWorker,50);setTimeout(reopenWorker,180);setTimeout(reopenWorker,450);setTimeout(reopenWorker,900)},true);
  const mo=new MutationObserver(()=>reopenWorker());mo.observe(d.getElementById('workers')||d.body,{childList:true,subtree:true});
}
function markVersion(){const h=d?.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP — FLEX v7'}
function enhance(){try{d=frame.contentDocument;if(!d?.body){setTimeout(enhance,200);return}patchStart();patchAdd();markVersion();let n=0;const t=setInterval(()=>{patchStart();patchAdd();markVersion();if(++n>20)clearInterval(t)},250)}catch(e){console.error(e);setTimeout(enhance,400)}}
frame.addEventListener('load',()=>setTimeout(enhance,250));
</script></body></html>
