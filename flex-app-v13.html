function addStyle(){if(d.getElementById('v13style'))return;const s=d.createElement('style');s.id='v13style';s.textContent=`

`;d.head.appendChild(s)}
function numericText(v){const m=String(v||'').replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);return m?parseFloat(m[0]):null}
function sortWeekly(dir){const table=d.querySelector('#weekBox table.weektable');const body=table?.querySelector('tbody');if(!body)return;const rows=[...body.querySelectorAll('tr')];rows.sort((a,b)=>{const av=numericText(a.lastElementChild?.textContent),bv=numericText(b.lastElementChild?.textContent);if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;return dir==='asc'?av-bv:bv-av});rows.forEach(r=>body.appendChild(r));markActive('weekly',dir)}
function sortHistory(dir){const box=d.getElementById('historyBox');if(!box)return;const head=box.querySelector('.historyRow.head');const rows=[...box.querySelectorAll('.historyRow:not(.head)')];rows.sort((a,b)=>{const ac=a.lastElementChild,b c=null;return 0})}
function sortHistoryReal(dir){const box=d.getElementById('historyBox');if(!box)return;const rows=[...box.querySelectorAll('.historyRow:not(.head)')];rows.sort((a,b)=>{const av=numericText(a.lastElementChild?.textContent),bv=numericText(b.lastElementChild?.textContent);if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;return dir==='asc'?av-bv:bv-av});rows.forEach(r=>box.appendChild(r));markActive('history',dir)}
function markActive(view,dir){d.querySelectorAll(`[data-sort-view="${view}"] .sortBtn`).forEach(b=>b.classList.toggle('active',b.dataset.dir===dir))}
function addSortBar(viewId,label){const sec=d.getElementById(viewId);if(!sec||sec.querySelector('[data-sort-view]'))return;const first=sec.querySelector('.card');if(!first)return;const bar=d.createElement('div');bar.className='card sortBar';bar.dataset.sortView=viewId;bar.innerHTML=`<span class="sortTitle">SORT AVG $/HR</span><button class="sortBtn" data-dir="asc">Low → High</button><button class="sortBtn" data-dir="desc">High → Low</button>`;first.insertAdjacentElement('afterend',bar);bar.querySelector('[data-dir="asc"]').onclick=()=>viewId==='weekly'?sortWeekly('asc'):sortHistoryReal('asc');bar.querySelector('[data-dir="desc"]').onclick=()=>viewId==='weekly'?sortWeekly('desc'):sortHistoryReal('desc')}
function hookCalculateButtons(){const wk=d.getElementById('showWeek'),hi=d.getElementById('showHistory');if(wk&&!wk.dataset.v13){wk.dataset.v13='1';wk.addEventListener('click',()=>setTimeout(()=>{const active=d.querySelector('[data-sort-view="weekly"] .sortBtn.active');if(active)sortWeekly(active.dataset.dir)},250))}if(hi&&!hi.dataset.v13){hi.dataset.v13='1';hi.addEventListener('click',()=>setTimeout(()=>{const active=d.querySelector('[data-sort-view="history"] .sortBtn.active');if(active)sortHistoryReal(active.dataset.dir)},250))}}
function refresh(){const deep=deepest();d=deep.doc;w=deep.win;if(!d?.body)return;addStyle();addSortBar('weekly','AVG');addSortBar('history','AVG');hookCalculateButtons();const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP — FLEX v13'}
function schedule(){clearTimeout(t);t=setTimeout(refresh,60)}
function enhance(){refresh();if(!d?.body){setTimeout(enhance,250);return}if(!d.body.dataset.v13){d.body.dataset.v13='1';new MutationObserver(()=>schedule()).observe(d.body,{childList:true,subtree:true})}let n=0;const id=setInterval(()=>{refresh();if(++n>30)clearInterval(id)},300)}
outer.addEventListener('load',()=>setTimeout(enhance,500));setTimeout(enhance,1000);
