<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLL E TEAM COSTA APP — FLEX v11</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" src="flex-app-v10.html?v=11" title="PLL E TEAM COSTA APP FLEX"></iframe>
<script>
const outer=document.getElementById('app');let d=null,w=null,t=null,lastWorker='';
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:0}
function hhmm(v){if(v===''||v==null)return null;let n=parseInt(v,10),h=Math.floor(n/100),m=n%100;if(h<0||h>23||m<0||m>59)return null;return h*60+m}
function elapsed(s,f){s=hhmm(s);f=hhmm(f);if(s==null||f==null)return 0;let x=f-s;if(x<0)x+=1440;return x}
function money(n){return '$'+(Number(n)||0).toFixed(2)}
function fire(el,type='input'){if(el)el.dispatchEvent(new Event(type,{bubbles:true}))}
function deepest(){try{let win=outer.contentWindow,doc=outer.contentDocument;for(let i=0;i<10;i++){if(!doc)break;const f=doc.querySelector('iframe#app,iframe');if(!f)break;if(!f.contentDocument||f.contentDocument===doc)break;win=f.contentWindow;doc=f.contentDocument}return{win,doc}}catch(e){return{win:null,doc:null}}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function style(){if(d.getElementById('v11style'))return;const s=d.createElement('style');s.id='v11style';s.textContent=`
.segAvg{grid-column:1/-1!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important;margin-top:4px!important;padding-top:7px!important;border-top:1px dashed #ddd!important}.segAvg span{display:block!important;background:#eef2f7!important;border-radius:8px!important;padding:7px 8px!important;font-size:11px!important;font-weight:900!important}.segAvg .low{color:#b42318!important;background:#fff0f0!important}.segAvg .good{color:#128a35!important;background:#eefbf2!important}.segUnpaidWrap{background:#fff7e8!important}.carryFlash{outline:2px solid #f28c28!important;background:#fff7e8!important}.blockBreakLabel{font-size:9px;color:#6b7280;margin-top:3px}
@media(max-width:700px){.segAvg{grid-template-columns:repeat(3,1fr)!important}.segAvg span{font-size:10px!important;padding:6px 5px!important}.worker[open]>summary{z-index:80!important}}
`;d.head.appendChild(s)}
function appWorker(workerEl){try{return w.day?.workers?.[workerEl.dataset.id]||null}catch(e){return null}}
function ensureUnpaid(workerEl){const aw=appWorker(workerEl),ss=[...workerEl.querySelectorAll('.seg')];ss.forEach((seg,i)=>{let inp=seg.querySelector('.blockUnpaid');if(!inp){const movement=seg.querySelector('.movement');if(!movement)return;const wrap=d.createElement('div');wrap.className='segUnpaidWrap';wrap.innerHTML='<label>UNPAID min</label><input class="blockUnpaid" type="number" min="0" step="1" placeholder="0"><div class="blockBreakLabel">This block only</div>';movement.closest('div')?.insertAdjacentElement('afterend',wrap);inp=wrap.querySelector('.blockUnpaid')}
 const saved=aw?.segments?.[i]?.unpaid;if(saved!=null&&String(inp.value)!==String(saved))inp.value=saved;
 if(!inp.dataset.v11){inp.dataset.v11='1';inp.addEventListener('input',()=>saveBlockUnpaid(workerEl));inp.addEventListener('change',()=>saveBlockUnpaid(workerEl))}
});const total=(aw?.segments||[]).reduce((a,s)=>a+num(s.unpaid),0);const dayU=workerEl.querySelector('.unpaid');if(dayU){dayU.readOnly=true;dayU.value=String(total)}}
function saveBlockUnpaid(workerEl){const aw=appWorker(workerEl);if(!aw)return;const ss=[...workerEl.querySelectorAll('.seg')];ss.forEach((seg,i)=>{if(aw.segments?.[i])aw.segments[i].unpaid=seg.querySelector('.blockUnpaid')?.value||''});aw.breaks=aw.breaks||{};aw.breaks.unpaid=String((aw.segments||[]).reduce((a,s)=>a+num(s.unpaid),0));try{w.scheduleSave()}catch(e){};refreshWorker(workerEl)}
function calcBlock(workerEl,seg,i){const aw=appWorker(workerEl);const raw=elapsed(seg.querySelector('.start')?.value,seg.querySelector('.finish')?.value);const move=num(seg.querySelector('.movement')?.value),unpaid=num(seg.querySelector('.blockUnpaid')?.value);const pre=i===0?num(workerEl.querySelector('.pre')?.value):0,smoko=i===0?num(workerEl.querySelector('.smoko')?.value):0;const netMin=Math.max(0,raw-move-unpaid-pre-smoko),net=netMin/60;const qty=num(seg.querySelector('.qty')?.value);let rate=num(seg.querySelector('.rate')?.value);if(!rate){const name=seg.querySelector('.blk')?.value||'';const b=(w.day?.meta?.blocks||[]).find(x=>(x.name||'')===name);rate=num(b?.rate)}const earn=qty*rate,avg=net>0?earn/net:null;let box=seg.querySelector('.segAvg');if(!box){box=d.createElement('div');box.className='segAvg';seg.appendChild(box)}box.innerHTML=`<span>BLOCK NET <b>${net.toFixed(2)}h</b></span><span>BLOCK EARN <b>${money(earn)}</b></span><span class="${avg==null?'':avg<30?'low':'good'}">BLOCK AVG <b>${avg==null?'-':money(avg)+'/HR'}</b></span>`}
function refreshWorker(workerEl){ensureUnpaid(workerEl);[...workerEl.querySelectorAll('.seg')].forEach((s,i)=>calcBlock(workerEl,s,i))}
function carryFromFinish(finish){const workerEl=finish.closest('.worker');if(!workerEl)return;const ss=[...workerEl.querySelectorAll('.seg')],cur=finish.closest('.seg'),i=ss.indexOf(cur),next=ss[i+1];if(!next||!finish.value)return;const st=next.querySelector('.start');if(st&&st.value!==finish.value){st.value=finish.value;fire(st,'input');fire(st,'change');st.classList.add('carryFlash');setTimeout(()=>st.classList.remove('carryFlash'),700)}}
function patchRender(){if(!w||w.__v11RenderPatched)return;try{const original=w.renderWorkers;if(typeof original!=='function')return;w.__v11RenderPatched=true;w.renderWorkers=function(){const openIds=[...w.document.querySelectorAll('.worker[open]')].map(x=>x.dataset.id);const active=w.document.activeElement?.closest?.('.worker')?.dataset.id||lastWorker||'';original();w.document.querySelectorAll('.worker').forEach(x=>x.open=false);const ids=openIds.length?openIds:(active?[active]:[]);ids.forEach(id=>{const el=w.document.querySelector('.worker[data-id="'+CSS.escape(id)+'"]');if(el)el.open=true});setTimeout(refresh,0)}}catch(e){console.error(e)}}
function patchEvents(){if(d.body.dataset.v11)return;d.body.dataset.v11='1';d.addEventListener('focusin',e=>{const we=e.target.closest?.('.worker');if(we)lastWorker=we.dataset.id||''},true);d.addEventListener('click',e=>{const we=e.target.closest?.('.worker');if(we)lastWorker=we.dataset.id||'';const add=e.target.closest?.('.addSeg');if(add&&we){const prev=[...we.querySelectorAll('.seg')].pop();const prevFinish=prev?.querySelector('.finish')?.value||'';setTimeout(()=>{const newer=d.querySelector('.worker[data-id="'+CSS.escape(lastWorker)+'"]');if(newer){d.querySelectorAll('.worker').forEach(x=>x.open=false);newer.open=true;const segs=[...newer.querySelectorAll('.seg')],last=segs[segs.length-1],st=last?.querySelector('.start');if(st&&!st.value&&prevFinish){st.value=prevFinish;fire(st,'input');fire(st,'change')}refreshWorker(newer)}},120)}setTimeout(refresh,120)},true);d.addEventListener('input',e=>{if(e.target.matches('.finish'))carryFromFinish(e.target);if(e.target.matches('.start,.finish,.qty,.rate,.movement,.pre,.smoko,.blockUnpaid')){const we=e.target.closest('.worker');if(we)refreshWorker(we)}},true);d.addEventListener('change',e=>{if(e.target.matches('.finish'))carryFromFinish(e.target);setTimeout(refresh,20)},true);new MutationObserver(()=>schedule()).observe(d.getElementById('workers')||d.body,{childList:true,subtree:true})}
function refresh(){const deep=deepest();d=deep.doc;w=deep.win;if(!d?.body||!w)return;style();patchRender();patchEvents();const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP — FLEX v11';d.querySelectorAll('.worker').forEach(refreshWorker)}
function schedule(){clearTimeout(t);t=setTimeout(refresh,40)}
function enhance(){refresh();if(!d?.body){setTimeout(enhance,250);return}d.querySelectorAll('.worker').forEach(x=>x.open=false);let n=0;const id=setInterval(()=>{refresh();if(++n>30)clearInterval(id)},300)}
outer.addEventListener('load',()=>setTimeout(enhance,500));setTimeout(enhance,1000);
</script></body></html>
