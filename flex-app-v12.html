<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLL E TEAM COSTA APP — FLEX v12</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" src="flex-app-v11.html?v=12" title="PLL E TEAM COSTA APP FLEX"></iframe>
<script>
const outer=document.getElementById('app');let d=null,w=null,t=null;
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:0}
function hhmm(v){if(v===''||v==null)return null;let n=parseInt(v,10),h=Math.floor(n/100),m=n%100;if(h<0||h>23||m<0||m>59)return null;return h*60+m}
function elapsed(s,f){s=hhmm(s);f=hhmm(f);if(s==null||f==null)return 0;let x=f-s;if(x<0)x+=1440;return x}
function deepest(){try{let win=outer.contentWindow,doc=outer.contentDocument;for(let i=0;i<12;i++){if(!doc)break;const f=doc.querySelector('iframe#app,iframe');if(!f||!f.contentDocument||f.contentDocument===doc)break;win=f.contentWindow;doc=f.contentDocument}return{win,doc}}catch(e){return{win:null,doc:null}}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function style(){if(d.getElementById('v12style'))return;const s=d.createElement('style');s.id='v12style';s.textContent=`
.blockTotalsCard{border:2px solid #fde0bd!important}.blockTotalsGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:8px}.blockTotalItem{background:#fff7e8;border-radius:10px;padding:9px}.blockTotalItem b{display:block;font-size:16px;margin-bottom:4px}.blockTotalItem span{display:block;font-size:12px;line-height:1.45}.blockTotalItem .low{color:#b42318;font-weight:900}.blockTotalItem .good{color:#128a35;font-weight:900}
@media(max-width:700px){.blockTotalsGrid{grid-template-columns:1fr 1fr}.blockTotalItem b{font-size:14px}.blockTotalItem span{font-size:11px}}
`;d.head.appendChild(s)}
function ensureCard(){let card=d.getElementById('blockTotalsCard');if(card)return card;const summary=d.querySelector('#daily .summary');if(!summary)return null;const holder=summary.closest('.card');if(!holder)return null;card=d.createElement('div');card.id='blockTotalsCard';card.className='card blockTotalsCard';card.innerHTML='<b>BLOCK / PATCH TOTALS</b><div class="small">Each area is totalled separately from all active pickers.</div><div id="blockTotalsGrid" class="blockTotalsGrid"></div>';holder.insertAdjacentElement('afterend',card);return card}
function blockDefs(){try{return (w.day?.meta?.blocks||[]).map(x=>({name:(x.name||'').trim(),rate:num(x.rate)})).filter(x=>x.name)}catch(e){return[]}}
function blockNet(workerEl,seg,i){const raw=elapsed(seg.querySelector('.start')?.value,seg.querySelector('.finish')?.value),move=num(seg.querySelector('.movement')?.value),unpaid=num(seg.querySelector('.blockUnpaid')?.value),pre=i===0?num(workerEl.querySelector('.pre')?.value):0,smoko=i===0?num(workerEl.querySelector('.smoko')?.value):0;return Math.max(0,raw-move-unpaid-pre-smoko)/60}
function refreshTotals(){if(!d||!w)return;const card=ensureCard();if(!card)return;const defs=blockDefs(),map={};defs.forEach(x=>map[x.name]={name:x.name,rate:x.rate,bin:0,piece:0,hrs:0,pickers:new Set()});d.querySelectorAll('.worker:not(.offline)').forEach(workerEl=>{[...workerEl.querySelectorAll('.seg')].forEach((seg,i)=>{const name=(seg.querySelector('.blk')?.value||'').trim();if(!name)return;if(!map[name])map[name]={name,rate:0,bin:0,piece:0,hrs:0,pickers:new Set()};const q=num(seg.querySelector('.qty')?.value);let rate=num(seg.querySelector('.rate')?.value);if(!rate)rate=map[name].rate||0;map[name].bin+=q;map[name].piece+=q*rate;map[name].hrs+=blockNet(workerEl,seg,i);if(workerEl.dataset.id)map[name].pickers.add(workerEl.dataset.id)})});const items=Object.values(map);const grid=d.getElementById('blockTotalsGrid');if(!grid)return;grid.innerHTML=items.length?items.map(x=>{const avg=x.hrs>0?x.piece/x.hrs:null;return `<div class="blockTotalItem"><b>${esc(x.name)}</b><span>TOTAL BIN: <strong>${x.bin.toFixed(2)}</strong></span><span>PIECE $: <strong>$${x.piece.toFixed(2)}</strong></span><span>NET HRS: <strong>${x.hrs.toFixed(2)}</strong></span><span class="${avg==null?'':avg<30?'low':'good'}">AREA AVG: ${avg==null?'-':'$'+avg.toFixed(2)+'/HR'}</span><span>${x.pickers.size} picker${x.pickers.size===1?'':'s'}${x.rate?' · $'+x.rate.toFixed(2)+'/BIN':''}</span></div>`}).join(''):'<div class="small">Add today\'s blocks above.</div>'}
function refresh(){const deep=deepest();d=deep.doc;w=deep.win;if(!d?.body||!w)return;style();const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP — FLEX v12';refreshTotals();if(!d.body.dataset.v12){d.body.dataset.v12='1';d.addEventListener('input',()=>schedule(),true);d.addEventListener('change',()=>schedule(),true);d.addEventListener('click',()=>setTimeout(refreshTotals,120),true);new MutationObserver(()=>schedule()).observe(d.getElementById('workers')||d.body,{childList:true,subtree:true})}}
function schedule(){clearTimeout(t);t=setTimeout(refresh,60)}
function enhance(){refresh();if(!d?.body){setTimeout(enhance,250);return}let n=0;const id=setInterval(()=>{refresh();if(++n>30)clearInterval(id)},300)}
outer.addEventListener('load',()=>setTimeout(enhance,500));setTimeout(enhance,1000);
</script></body></html>
