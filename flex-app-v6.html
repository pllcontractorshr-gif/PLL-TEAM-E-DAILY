<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLL E TEAM COSTA APP — FLEX v6</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" src="flex-app-v3.html?v=6" title="PLL E TEAM COSTA APP FLEX"></iframe>
<script>
const frame=document.getElementById('app');let w,d,ready=false;
function x(code){return w.eval(code)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function installStyle(){if(d.getElementById('v6style'))return;const s=d.createElement('style');s.id='v6style';s.textContent=`.addPickerCard{border:2px solid #dbeafe!important}.addPickerGrid{display:grid;grid-template-columns:.7fr 1.4fr auto;gap:7px;align-items:end}.v6note{font-size:12px;color:#6b7280;margin-top:5px}@media(max-width:700px){.addPickerGrid{grid-template-columns:1fr 1.5fr}.addPickerGrid button{grid-column:1/-1}.worker[open]>summary{top:105px!important;z-index:70!important}}`;d.head.appendChild(s)}
function preserveOpenPatch(){try{x(`if(!window.__v6RenderPatched){window.__v6RenderPatched=true;const __rw=renderWorkers;renderWorkers=function(){const openIds=[...document.querySelectorAll('.worker[open]')].map(n=>n.dataset.id);__rw();openIds.forEach(id=>{const el=document.querySelector('.worker[data-id="'+CSS.escape(id)+'"]');if(el)el.open=true});};}`)}catch(e){}}
function removeK0210(){try{x(`(()=>{const i=EMP.findIndex(e=>e.id==='K0210');if(i>=0)EMP.splice(i,1);if(day?.meta?.extraEmployees)day.meta.extraEmployees=day.meta.extraEmployees.filter(e=>e.id!=='K0210');renderWorkers();refreshSummary();})()`)}catch(e){}}
function syncExtras(){try{x(`(()=>{if(!day||!day.meta)return;day.meta.extraEmployees=day.meta.extraEmployees||[];day.meta.extraEmployees.forEach(e=>{if(e&&e.id&&e.id!=='K0210'&&!EMP.some(x=>x.id===e.id))EMP.push({id:e.id,name:e.name||e.id})});const i=EMP.findIndex(e=>e.id==='K0210');if(i>=0)EMP.splice(i,1);})()`)}catch(e){}}
function applyStartAll(){const c=d.getElementById('commonStart');if(!c)return;const v=(c.value||'').trim();if(!/^\d{3,4}$/.test(v)){alert('Enter start time like 0857');return}try{x(`(()=>{const v=${JSON.stringify(v)};day.meta.commonStart=v;EMP.forEach(e=>{const a=worker(e);if(a.offline)return;if(!a.segments||!a.segments.length)a.segments=[{id:uid(),block:'',qty:'',rate:'',start:'',finish:'',movement:''}];a.segments[0].start=v;});renderWorkers();refreshSummary();scheduleSave();})()`);setTimeout(()=>{d.querySelectorAll('.worker').forEach(el=>{const first=el.querySelector('.seg .start');if(first&&!first.value){first.value=v;first.dispatchEvent(new Event('input',{bubbles:true}))}})},100)}catch(e){console.error(e)}}
function patchStart(){const b=d.getElementById('applyStart'),c=d.getElementById('commonStart');if(!b||!c||b.dataset.v6)return;b.dataset.v6='1';b.onclick=e=>{e.preventDefault();applyStartAll()};c.addEventListener('change',applyStartAll);c.addEventListener('blur',()=>{if((c.value||'').trim())applyStartAll()})}
function addPickerUI(){if(d.getElementById('addPickerCard'))return;const workers=d.getElementById('workers');if(!workers)return;const card=d.createElement('div');card.id='addPickerCard';card.className='card addPickerCard';card.innerHTML=`<b>ADD PICKER / EXTRA WORKER</b><div class="v6note">Add someone who is not in the normal picker list. They will save with this day and sync to cloud.</div><div class="addPickerGrid" style="margin-top:8px"><div><label>Picker No.</label><input id="newPickerId" placeholder="e.g. EXTRA3"></div><div><label>Name</label><input id="newPickerName" placeholder="Worker name"></div><button id="addPickerBtn" class="action">+ Add Picker</button></div>`;workers.parentNode.insertBefore(card,workers);card.querySelector('#addPickerBtn').onclick=()=>{const id=card.querySelector('#newPickerId').value.trim().toUpperCase(),name=card.querySelector('#newPickerName').value.trim();if(!id||!name)return alert('Enter Picker No. and Name.');try{x(`(()=>{const e={id:${JSON.stringify(id)},name:${JSON.stringify(name)}};if(EMP.some(x=>x.id===e.id))return;day.meta.extraEmployees=day.meta.extraEmployees||[];day.meta.extraEmployees.push(e);EMP.push(e);day.workers[e.id]=day.workers[e.id]||blankWorker(e);renderWorkers();refreshSummary();scheduleSave();})()`);setTimeout(()=>{const el=d.querySelector('.worker[data-id="'+CSS.escape(id)+'"]');if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'center'})}},120);card.querySelector('#newPickerId').value='';card.querySelector('#newPickerName').value=''}catch(e){console.error(e);alert('Could not add picker.')}}}
function keepOpenOnAdd(){if(d.body.dataset.v6add)return;d.body.dataset.v6add='1';d.addEventListener('click',ev=>{const btn=ev.target.closest?.('.addSeg');if(!btn)return;const det=btn.closest('.worker');if(!det)return;const id=det.dataset.id;setTimeout(()=>{const el=d.querySelector('.worker[data-id="'+CSS.escape(id)+'"]');if(el){el.open=true;const segs=el.querySelectorAll('.seg');segs[segs.length-1]?.scrollIntoView({behavior:'smooth',block:'center'})}},80)},true)}
function enhance(){try{w=frame.contentWindow;d=frame.contentDocument;if(!d?.body){setTimeout(enhance,250);return}installStyle();preserveOpenPatch();syncExtras();removeK0210();patchStart();addPickerUI();keepOpenOnAdd();const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP — FLEX v6';if(!ready){ready=true;let n=0;const t=setInterval(()=>{syncExtras();patchStart();addPickerUI();keepOpenOnAdd();if(++n>20)clearInterval(t)},300)}}catch(e){console.error(e);setTimeout(enhance,500)}}
frame.addEventListener('load',()=>setTimeout(enhance,300));
</script></body></html>
