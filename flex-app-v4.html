<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PLL E TEAM COSTA APP — FLEX v5</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="flex-app-v3.html?v=5" title="PLL E TEAM COSTA APP FLEX"></iframe>
<script>
const frame=document.getElementById('app');
let d,w,summaryTimer=null,lastOpenPicker='';
function fire(el,type='input'){if(!el)return;el.dispatchEvent(new Event(type,{bubbles:true}))}
function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function addStyles(){if(d.getElementById('flexV5Style'))return;const s=d.createElement('style');s.id='flexV5Style';s.textContent=`
.blockTotalsCard{border:2px solid #fde0bd!important}.blockTotalsGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:8px}.blockTotalItem{background:#fff7e8;border-radius:10px;padding:9px}.blockTotalItem b{display:block;font-size:16px;margin-bottom:3px}.blockTotalItem span{display:block;font-size:12px}.autoTimeNote{display:inline-block;margin-top:4px;padding:4px 7px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:800;color:#2563eb}.gStartWrap{opacity:.55}.gStartWrap input{background:#f3f4f6!important}.seg .finishAuto{outline:2px solid #f28c28!important}.startApplied{outline:2px solid #16a34a!important}.keepOpenNote{font-size:10px;color:#f28c28;font-weight:900;margin-left:6px}
@media(max-width:700px){.blockTotalsGrid{grid-template-columns:1fr 1fr}.worker[open]>summary{top:105px!important;z-index:60!important}}
`;d.head.appendChild(s)}
function setGroupStartFromFinish(){const fin=d.getElementById('gFinish'),st=d.getElementById('gStart');if(!fin||!st)return;st.value=fin.value||'';fire(st)}
function patchGroupMove(){const fin=d.getElementById('gFinish'),st=d.getElementById('gStart');if(!fin||!st)return;if(!fin.dataset.v5){fin.dataset.v5='1';fin.addEventListener('input',setGroupStartFromFinish);fin.addEventListener('change',setGroupStartFromFinish)}const wrap=st.parentElement;if(wrap&&!wrap.classList.contains('gStartWrap')){wrap.classList.add('gStartWrap');let n=d.createElement('div');n.className='autoTimeNote';n.textContent='AUTO = current FINISH';wrap.appendChild(n)}st.readOnly=true;setGroupStartFromFinish()}
function applyCommonStartDirect(){const c=d.getElementById('commonStart');if(!c)return;const v=(c.value||'').trim();if(!/^\d{3,4}$/.test(v))return;d.querySelectorAll('.worker:not(.offline)').forEach(det=>{const first=det.querySelector('.seg .start');if(!first)return;first.value=v;fire(first,'input');first.classList.add('startApplied');setTimeout(()=>first.classList.remove('startApplied'),600)})}
function patchCommonStart(){const c=d.getElementById('commonStart'),b=d.getElementById('applyStart');if(!c||c.dataset.v5)return;c.dataset.v5='1';const apply=()=>applyCommonStartDirect();c.addEventListener('change',apply);c.addEventListener('blur',apply);c.addEventListener('input',()=>{clearTimeout(c._v5t);c._v5t=setTimeout(()=>{if((c.value||'').trim().length>=3)apply()},350)});if(b&&!b.dataset.v5){b.dataset.v5='1';b.addEventListener('click',()=>setTimeout(applyCommonStartDirect,20),true)}}
function patchSegmentAutoCarry(){d.querySelectorAll('.worker .seg').forEach(seg=>{const finish=seg.querySelector('.finish');if(!finish||finish.dataset.v5)return;finish.dataset.v5='1';const carry=()=>{const worker=seg.closest('.worker');if(!worker)return;const segs=[...worker.querySelectorAll('.seg')],idx=segs.indexOf(seg),next=segs[idx+1];if(!next)return;const nextStart=next.querySelector('.start');if(nextStart&&finish.value){nextStart.value=finish.value;fire(nextStart);nextStart.classList.add('finishAuto');setTimeout(()=>nextStart.classList.remove('finishAuto'),700)}};finish.addEventListener('input',carry);finish.addEventListener('change',carry)})}
function rememberOpenPicker(){const open=d.querySelector('.worker[open]');if(open?.dataset.id)lastOpenPicker=open.dataset.id}
function reopenPicker(id=lastOpenPicker){if(!id)return;const det=d.querySelector(`.worker[data-id="${CSS.escape(id)}"]`);if(det){det.open=true;lastOpenPicker=id}}
function patchAddWorkBlock(){d.querySelectorAll('.worker .addSeg').forEach(btn=>{if(btn.dataset.v5)return;btn.dataset.v5='1';btn.addEventListener('click',()=>{const det=btn.closest('.worker');if(det?.dataset.id)lastOpenPicker=det.dataset.id;setTimeout(()=>{reopenPicker();patchSegmentAutoCarry();applyMissingStartToFirst()},60);setTimeout(()=>reopenPicker(),180)},true)})}
function applyMissingStartToFirst(){const c=d.getElementById('commonStart'),v=(c?.value||'').trim();if(!/^\d{3,4}$/.test(v))return;d.querySelectorAll('.worker:not(.offline)').forEach(det=>{const first=det.querySelector('.seg .start');if(first&&!first.value){first.value=v;fire(first,'input')}})}
function ensureBlockTotalsCard(){let card=d.getElementById('blockTotalsCard');if(card)return card;const summary=d.querySelector('#daily .card .summary');if(!summary)return null;const holder=summary.closest('.card');card=d.createElement('div');card.id='blockTotalsCard';card.className='card blockTotalsCard';card.innerHTML='<b>BLOCK / PATCH TOTALS</b><div class="small">BIN totals are separated by area. Piece $ uses each area’s $/BIN.</div><div id="blockTotalsGrid" class="blockTotalsGrid"></div>';holder.insertAdjacentElement('afterend',card);return card}
function blockRateMap(){const m={};d.querySelectorAll('#blocks .blockrow').forEach(r=>{const n=r.querySelector('.bn')?.value?.trim(),rt=parseFloat(r.querySelector('.br')?.value);if(n)m[n]={rate:Number.isFinite(rt)?rt:null}});return m}
function refreshBlockTotals(){if(!d)return;const card=ensureBlockTotalsCard();if(!card)return;const rates=blockRateMap(),tot={};d.querySelectorAll('.worker:not(.offline) .seg').forEach(seg=>{const block=seg.querySelector('.blk')?.value?.trim();if(!block)return;const q=parseFloat(seg.querySelector('.qty')?.value),manual=parseFloat(seg.querySelector('.rate')?.value);if(!tot[block])tot[block]={bin:0,piece:0,pickers:new Set()};if(Number.isFinite(q)){tot[block].bin+=q;const rt=Number.isFinite(manual)?manual:(rates[block]?.rate);if(Number.isFinite(rt))tot[block].piece+=q*rt}const id=seg.closest('.worker')?.dataset.id;if(id)tot[block].pickers.add(id)});const names=[...Object.keys(rates),...Object.keys(tot).filter(x=>!rates[x])];const grid=d.getElementById('blockTotalsGrid');if(!grid)return;grid.innerHTML=names.length?names.map(n=>{const x=tot[n]||{bin:0,piece:0,pickers:new Set()},rt=rates[n]?.rate;return `<div class="blockTotalItem"><b>${escapeHtml(n)}</b><span>BIN: <strong>${x.bin.toFixed(2)}</strong></span><span>Piece $: <strong>$${x.piece.toFixed(2)}</strong></span><span>${Number.isFinite(rt)?'$'+rt.toFixed(2)+'/BIN · ':''}${x.pickers.size} picker${x.pickers.size===1?'':'s'}</span></div>`}).join(''):'<div class="small">Add today’s blocks above.</div>'}
function scheduleSummary(){clearTimeout(summaryTimer);summaryTimer=setTimeout(refreshBlockTotals,100)}
function patchListeners(){if(d.body.dataset.v5listeners)return;d.body.dataset.v5listeners='1';d.addEventListener('toggle',e=>{if(e.target?.classList?.contains('worker')&&e.target.open&&e.target.dataset.id)lastOpenPicker=e.target.dataset.id},true);d.addEventListener('input',e=>{if(e.target.matches('.qty,.rate,.bn,.br,.blk,.finish,.start'))setTimeout(()=>{patchSegmentAutoCarry();patchAddWorkBlock();scheduleSummary()},20)},true);d.addEventListener('change',e=>{if(e.target.matches('.blk,.qty,.rate,.bn,.br,.finish,.start'))setTimeout(()=>{patchSegmentAutoCarry();patchAddWorkBlock();scheduleSummary()},20)},true);d.addEventListener('click',e=>{const add=e.target.closest?.('.addSeg');if(add){const det=add.closest('.worker');if(det?.dataset.id)lastOpenPicker=det.dataset.id}setTimeout(()=>{patchSegmentAutoCarry();patchGroupMove();patchAddWorkBlock();reopenPicker();refreshBlockTotals()},100)},true)}
function enhance(){try{w=frame.contentWindow;d=frame.contentDocument;if(!d||!d.body){setTimeout(enhance,250);return}addStyles();const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP — FLEX v5';patchGroupMove();patchCommonStart();patchSegmentAutoCarry();patchAddWorkBlock();patchListeners();applyMissingStartToFirst();refreshBlockTotals();let n=0,id=setInterval(()=>{rememberOpenPicker();patchGroupMove();patchCommonStart();patchSegmentAutoCarry();patchAddWorkBlock();applyMissingStartToFirst();reopenPicker();refreshBlockTotals();if(++n>15)clearInterval(id)},350)}catch(e){console.error(e);setTimeout(enhance,500)}}
frame.addEventListener('load',()=>setTimeout(enhance,250));
</script>
</body>
</html>
