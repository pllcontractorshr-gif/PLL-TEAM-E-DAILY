<head>

<title>PLL E TEAM COSTA APP</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="legacy.html?v=cloud2" title="PLL E TEAM COSTA APP"></iframe>
<script>
const KEY='pll_daily_app_v3';
const SUPABASE_URL='https://jptppvrpqyzehizzsctt.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwdHBwdnJwcXl6ZWhpenpzY3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMzg4MTgsImV4cCI6MjEwMjYxNDgxOH0.fn9ctMQ4acIOWnQ4p2_ATOWkrE4Gzjzb52-pb1AhR5c';
const HEADERS={apikey:SUPABASE_ANON,Authorization:'Bearer '+SUPABASE_ANON};
const frame=document.getElementById('app');let w=null,d=null;
function localStore(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function putLocal(s){localStorage.setItem(KEY,JSON.stringify(s))}function status(msg){try{const e=d&&d.getElementById('saveStatus');if(e)e.textContent=msg}catch(e){}}function currentDate(){try{return d.getElementById('workDate').value||new Date().toISOString().slice(0,10)}catch(e){return new Date().toISOString().slice(0,10)}}
async function cloudSaveDate(date){const s=localStore(),data=s[date];if(!data){status('Nothing to Cloud Save');return false}status('Saving to Cloud…');try{const r=await fetch(SUPABASE_URL+'/rest/v1/pll_daily_records?on_conflict=work_date',{method:'POST',headers:{...HEADERS,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({work_date:date,data,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error(await r.text());status('Cloud Saved ✓ '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));return true}catch(e){console.error(e);status('Cloud Save Failed — Local Safe ✓');return false}}
async function cloudLoadDate(date){try{const r=await fetch(SUPABASE_URL+'/rest/v1/pll_daily_records?select=work_date,data&work_date=eq.'+encodeURIComponent(date)+'&limit=1',{headers:HEADERS});if(!r.ok)throw new Error(await r.text());const rows=await r.json();if(rows.length){const s=localStore();s[date]=rows[0].data;putLocal(s);status('Cloud Loaded ✓');return true}return false}catch(e){console.error(e);status('Cloud Offline — Local Mode');return false}}
async function cloudSyncAll(){status('Syncing Cloud…');try{const r=await fetch(SUPABASE_URL+'/rest/v1/pll_daily_records?select=work_date,data&order=work_date.asc',{headers:HEADERS});if(!r.ok)throw new Error(await r.text());const rows=await r.json(),s=localStore();rows.forEach(x=>s[x.work_date]=x.data);putLocal(s);status('Cloud Synced ✓');return rows.length}catch(e){console.error(e);status('Cloud Offline — Local Mode');return 0}}
async function uploadAllLocal(){const s=localStore(),dates=Object.keys(s).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));if(!dates.length){alert('No local history found.');return}if(!confirm('Upload '+dates.length+' local saved day(s) to Cloud?'))return;status('Uploading Local History…');try{const body=dates.map(x=>({work_date:x,data:s[x],updated_at:new Date().toISOString()}));const r=await fetch(SUPABASE_URL+'/rest/v1/pll_daily_records?on_conflict=work_date',{method:'POST',headers:{...HEADERS,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());status('Cloud History Uploaded ✓');alert('Cloud upload complete. Your '+dates.length+' saved day(s) are now available to your iPhone/computer.')}catch(e){console.error(e);status('Cloud Upload Failed — Local Safe ✓');alert('Upload failed. Your local records are still safe on this device.')}}
function rerenderDaily(){try{if(typeof w.renderDaily==='function')w.renderDaily()}catch(e){}}function rerenderHistory(){try{if(typeof w.renderHistory==='function')w.renderHistory()}catch(e){}}function rerenderWeek(){try{if(typeof w.renderWeek==='function')w.renderWeek()}catch(e){}}function addButton(parent,id,label,cls='action secondary'){if(!parent||d.getElementById(id))return d.getElementById(id);const box=d.createElement('div'),b=d.createElement('button');b.id=id;b.className=cls;b.type='button';b.textContent=label;box.appendChild(b);parent.appendChild(box);return b}
async function enhance(){w=frame.contentWindow;d=frame.contentDocument;if(!d||!d.body)return;d.title='PLL E TEAM COSTA APP';const header=d.querySelector('header');if(header)header.textContent='PLL E TEAM COSTA APP';const toolbar=d.querySelector('#daily .toolbar');const refresh=addButton(toolbar,'cloudRefresh','Refresh Cloud');if(refresh)refresh.addEventListener('click',async()=>{await cloudSyncAll();rerenderDaily()});const save=d.getElementById('saveDay');if(save)save.addEventListener('click',()=>setTimeout(()=>cloudSaveDate(currentDate()),80));const workDate=d.getElementById('workDate');if(workDate)workDate.addEventListener('change',async()=>{await cloudLoadDate(workDate.value);rerenderDaily()});const showHistory=d.getElementById('showHistory');if(showHistory)showHistory.addEventListener('click',async()=>{const x=d.getElementById('historyDate').value;await cloudLoadDate(x);rerenderHistory()});const showWeek=d.getElementById('showWeek');if(showWeek)showWeek.addEventListener('click',async()=>{await cloudSyncAll();rerenderWeek()});d.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',async()=>{if(b.dataset.view==='history'){await cloudLoadDate(currentDate());rerenderHistory()}if(b.dataset.view==='weekly'){await cloudSyncAll();rerenderWeek()}}));const exportCard=d.querySelector('#export .card');if(exportCard&&!d.getElementById('uploadAllCloud')){const b=d.createElement('button');b.id='uploadAllCloud';b.className='action';b.type='button';b.textContent='Upload Local History to Cloud';b.style.marginBottom='8px';exportCard.insertBefore(b,exportCard.firstChild);b.addEventListener('click',uploadAllLocal)}status('Cloud Ready');await cloudSyncAll();rerenderDaily()}
frame.addEventListener('load',enhance);
</script></body></html>
