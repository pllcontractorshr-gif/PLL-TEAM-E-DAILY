<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PLL E TEAM COSTA APP</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="legacy.html?v=stable12" title="PLL E TEAM COSTA APP"></iframe>
<script>
const KEY='pll_daily_app_v3';
const SUPABASE_URL='https://jptppvrpqyzehizzsctt.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwdHBwdnJwcXl6ZWhpenpzY3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMzg4MTgsImV4cCI6MjEwMjYxNDgxOH0.fn9ctMQ4acIOWnQ4p2_ATOWkrE4Gzjzb52-pb1AhR5c';
const HEADERS={apikey:SUPABASE_ANON,Authorization:'Bearer '+SUPABASE_ANON};
const frame=document.getElementById('app');
let w,d,lastChange=0,saveTimer=null,syncing=false;
function local(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function put(x){localStorage.setItem(KEY,JSON.stringify(x))}
function status(x){try{const e=d&&d.getElementById('saveStatus');if(e)e.textContent=x}catch(e){}}
function workDate(){try{return d.getElementById('workDate').value||new Date().toISOString().slice(0,10)}catch(e){return new Date().toISOString().slice(0,10)}}
async function upsert(rows){if(!rows.length)return;const r=await fetch(SUPABASE_URL+'/rest/v1/pll_daily_records?on_conflict=work_date',{method:'POST',headers:{...HEADERS,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(!r.ok)throw Error(await r.text())}
async function saveCloud(silent=false){const s=local(),x=workDate();if(!s[x])return;try{if(!silent)status('Saving to Cloud…');await upsert([{work_date:x,data:s[x],updated_at:new Date().toISOString()}]);status('Cloud Saved ✓')}catch(e){console.error(e);status('Cloud Save Failed — Local Safe ✓')}}
async function loadCloud(x=workDate()){try{const r=await fetch(SUPABASE_URL+'/rest/v1/pll_daily_records?select=work_date,data&work_date=eq.'+encodeURIComponent(x)+'&limit=1',{headers:HEADERS});if(!r.ok)throw Error(await r.text());const rows=await r.json();if(rows.length){const s=local();if(JSON.stringify(s[x]||null)!==JSON.stringify(rows[0].data)){s[x]=rows[0].data;put(s);w.renderDaily&&w.renderDaily()}}status('Cloud Live ✓')}catch(e){console.error(e);status('Cloud Offline — Local Mode')}}
async function syncAll(){if(syncing)return;syncing=true;try{const r=await fetch(SUPABASE_URL+'/rest/v1/pll_daily_records?select=work_date,data',{headers:HEADERS});if(!r.ok)throw Error(await r.text());const rows=await r.json(),s=local();let changed=false;rows.forEach(x=>{if(JSON.stringify(s[x.work_date]||null)!==JSON.stringify(x.data)){s[x.work_date]=x.data;changed=true}});if(changed){put(s);w.renderDaily&&w.renderDaily()}status('Cloud Live ✓')}catch(e){console.error(e);status('Cloud Offline — Local Mode')}finally{syncing=false}}
function minusOneMinute(txt){const m=(txt||'').match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return'';const h=(+m[1])%12+(m[3].toUpperCase()==='PM'?12:0);return w.clock(h*60+(+m[2])-1)}
function ensureStyles(){if(d.getElementById('pllStableStyle'))return;const s=d.createElement('style');s.id='pllStableStyle';s.textContent=`
.t31,.t32{display:none!important}
.t29,.t30{display:table-cell!important;min-width:110px!important;white-space:nowrap!important;font-weight:800!important;background:#fafafa!important}
.finalGood{color:#128a35!important;font-weight:800!important}.finalBad{color:#d11a2a!important;font-weight:800!important}
@media(max-width:700px){
#historyTable{min-width:560px!important;width:560px!important;table-layout:fixed!important}
#historyTable th:nth-child(1),#historyTable td:nth-child(1){width:72px!important}
#historyTable th:nth-child(2),#historyTable td:nth-child(2){width:135px!important;white-space:normal!important;word-break:break-word!important;text-align:left!important}
#historyTable th:nth-child(n+3),#historyTable td:nth-child(n+3){width:78px!important}
#dailyTable td.name{width:135px!important;min-width:135px!important;max-width:135px!important;white-space:normal!important;word-break:break-word!important}
}`;d.head.appendChild(s)}
function patchTable(){if(!d||!w)return;ensureStyles();const table=d.getElementById('dailyTable');if(!table)return;const head=table.querySelector('thead tr');if(!head)return;const ths=[...head.children];const avg=ths.find(x=>['Avg $/Hr','AVE $/HR'].includes(x.textContent.trim()));if(avg)avg.textContent='AVE $/HR';const h29=ths.find(x=>x.textContent.trim()==='$29 Finish'||x.classList.contains('topupHead'));const h30=ths.find(x=>x.textContent.trim()==='$30 Finish'||x.classList.contains('adviseHead'));const h31=ths.find(x=>x.textContent.trim()==='$31 Finish');const h32=ths.find(x=>x.textContent.trim()==='$32 Finish');if(h29){h29.textContent='TOPUP';h29.classList.add('topupHead');h29.style.display='table-cell'}if(h30){h30.textContent='ADVISE TIME >$30';h30.classList.add('adviseHead');h30.style.display='table-cell'}if(h31)h31.style.display='none';if(h32)h32.style.display='none';
const day=local()[workDate()]||{};
table.querySelectorAll('tbody tr').forEach(tr=>{
 const net=parseFloat((tr.querySelector('.net')?.textContent||'').replace(/[^0-9.-]/g,''));
 const earn=parseFloat((tr.querySelector('.earn')?.textContent||'').replace(/[^0-9.-]/g,''));
 const hrVal=parseFloat((tr.querySelector('.hr')?.textContent||'').replace(/[^0-9.-]/g,''));
 const top=(Number.isFinite(net)&&Number.isFinite(earn))?Math.max(0,33.05*net-earn):null;
 const c29=tr.querySelector('.t29'),c30=tr.querySelector('.t30'),c31=tr.querySelector('.t31'),c32=tr.querySelector('.t32');
 if(c31)c31.style.display='none';if(c32)c32.style.display='none';
 if(c29){c29.style.display='table-cell';c29.textContent=top==null?'':w.money(top);c29.classList.toggle('finalGood',top>0)}
 let advise='';
 try{const emp=w.allEmployees().find(x=>x.id===tr.dataset.id);if(emp){const r=Object.assign(w.blank(emp),day[emp.id]||{});tr.querySelectorAll('input[data-k]').forEach(i=>r[i.dataset.k]=i.value);if(Number.isFinite(hrVal)&&hrVal<30){const exact=w.target(r,30);advise=minusOneMinute(exact)}}}catch(e){console.error(e)}
 if(c30){c30.style.display='table-cell';c30.textContent=advise}
 const h=tr.querySelector('.hr');if(h){h.classList.remove('finalGood','finalBad');if(Number.isFinite(hrVal))h.classList.add(hrVal<30?'finalBad':'finalGood')}
});}
function scheduleSave(){lastChange=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveCloud(false),900)}
async function enhance(){w=frame.contentWindow;d=frame.contentDocument;if(!d)return;d.title='PLL E TEAM COSTA APP';const header=d.querySelector('header');if(header)header.textContent='PLL E TEAM COSTA APP';setTimeout(patchTable,80);const daily=d.getElementById('dailyTable');daily&&daily.addEventListener('input',()=>{setTimeout(patchTable,60);scheduleSave()});daily&&daily.addEventListener('click',()=>setTimeout(patchTable,120));d.getElementById('blockNo')?.addEventListener('input',scheduleSave);d.getElementById('saveDay')?.addEventListener('click',()=>setTimeout(()=>{patchTable();saveCloud(false)},200));d.getElementById('workDate')?.addEventListener('change',async e=>{await loadCloud(e.target.value);setTimeout(patchTable,150)});d.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setTimeout(patchTable,100)));
const toolbar=d.querySelector('#daily .toolbar');if(toolbar&&!d.getElementById('cloudRefresh')){const box=d.createElement('div'),b=d.createElement('button');b.id='cloudRefresh';b.type='button';b.className='action secondary';b.textContent='Refresh Cloud';b.onclick=async()=>{await syncAll();setTimeout(patchTable,150)};box.appendChild(b);toolbar.appendChild(box)}
const card=d.querySelector('#export .card');if(card&&!d.getElementById('uploadAllCloud')){const b=d.createElement('button');b.id='uploadAllCloud';b.className='action';b.textContent='Upload Local History to Cloud';b.style.marginBottom='8px';b.onclick=async()=>{const s=local(),dates=Object.keys(s).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));try{await upsert(dates.map(x=>({work_date:x,data:s[x],updated_at:new Date().toISOString()})));alert('Cloud upload complete.');status('Cloud History Uploaded ✓')}catch(e){alert('Upload failed. Local data is still safe.')}};card.insertBefore(b,card.firstChild)}
await syncAll();setTimeout(patchTable,180);setInterval(async()=>{if(Date.now()-lastChange>4000){await loadCloud(workDate());setTimeout(patchTable,150)}},30000);window.addEventListener('focus',()=>{syncAll().then(()=>setTimeout(patchTable,150))})}
frame.addEventListener('load',enhance);
</script>
</body>
</html>
