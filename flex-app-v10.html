<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLL E TEAM COSTA APP — FLEX v10</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" src="flex-app-v7.html?v=10" title="PLL E TEAM COSTA APP FLEX"></iframe>
<script>
const outer=document.getElementById('app');let d=null,t=null;
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:0}
function hhmm(v){if(v===''||v==null)return null;let n=parseInt(v,10),h=Math.floor(n/100),m=n%100;if(h<0||h>23||m<0||m>59)return null;return h*60+m}
function elapsed(s,f){s=hhmm(s);f=hhmm(f);if(s==null||f==null)return 0;let x=f-s;if(x<0)x+=1440;return x}
function money(n){return '$'+(Number(n)||0).toFixed(2)}
function fire(el,type='input'){if(el)el.dispatchEvent(new Event(type,{bubbles:true}))}
function deepestDoc(){try{let doc=outer.contentDocument;for(let i=0;i<8;i++){if(!doc)break;const f=doc.querySelector('iframe#app,iframe');if(!f)break;const nd=f.contentDocument;if(!nd||nd===doc)break;doc=nd}return doc}catch(e){return null}}
function style(){if(d.getElementById('v10style'))return;const s=d.createElement('style');s.id='v10style';s.textContent=`
.segUnpaidWrap{background:#fff7e8!important}.segUnpaidWrap input{background:#fff!important}.dayUnpaidHidden{opacity:.45}.dayUnpaidHidden label::after{content:' (AUTO TOTAL FROM BLOCKS)';font-size:9px;color:#f28c28}.dayUnpaidHidden input{background:#f3f4f6!important}.segAvg{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:2px;padding-top:7px;border-top:1px dashed #ddd}.segAvg span{display:block;background:#eef2f7;border-radius:8px;padding:7px 8px;font-size:11px;font-weight:900}.segAvg .low{color:#b42318;background:#fff0f0}.segAvg .good{color:#128a35;background:#eefbf2}
@media(max-width:700px){.seg{grid-template-columns:1fr 1fr 1fr!important}.segUnpaidWrap{grid-column:auto!important}.segAvg{grid-template-columns:repeat(3,1fr)}.segAvg span{font-size:10px;padding:6px 5px}}
`;d.head.appendChild(s)}
function segs(worker){return [...worker.querySelectorAll('.seg')]}
function stored(worker,idx){const id=worker.dataset.id||'';try{const raw=localStorage.getItem('pll_block_unpaid_v10')||'{}';const all=JSON.parse(raw);const date=d.getElementById('date')?.value||'';return all?.[date]?.[id]?.[idx]??''}catch(e){return''}}
function saveStored(worker){const id=worker.dataset.id||'',date=d.getElementById('date')?.value||'';if(!id||!date)return;let all={};try{all=JSON.parse(localStorage.getItem('pll_block_unpaid_v10')||'{}')}catch(e){};all[date]=all[date]||{};all[date][id]=segs(worker).map(s=>s.querySelector('.blockUnpaid')?.value||'');localStorage.setItem('pll_block_unpaid_v10',JSON.stringify(all))}
function ensure(worker){const ss=segs(worker);ss.forEach((seg,i)=>{if(seg.querySelector('.blockUnpaid'))return;const movement=seg.querySelector('.movement');if(!movement)return;const wrap=d.createElement('div');wrap.className='segUnpaidWrap';wrap.innerHTML='<label>UNPAID min</label><input class="blockUnpaid" type="number" min="0" step="1" placeholder="0">';movement.closest('div')?.insertAdjacentElement('afterend',wrap);const input=wrap.querySelector('.blockUnpaid');input.value=stored(worker,i);input.addEventListener('input',()=>{saveStored(worker);sync(worker);calc(worker)});input.addEventListener('change',()=>{saveStored(worker);sync(worker);calc(worker)})});const u=worker.querySelector('.unpaid');if(u){u.parentElement?.classList.add('dayUnpaidHidden');u.readOnly=true;sync(worker)}}
function sync(worker){const total=segs(worker).reduce((a,s)=>a+num(s.querySelector('.blockUnpaid')?.value),0);const u=worker.querySelector('.unpaid');if(u&&num(u.value)!==total){u.value=String(total);fire(u,'input');fire(u,'change')}}
function migrate(worker){const ss=segs(worker);if(!ss.length)return;if(ss.some(s=>num(s.querySelector('.blockUnpaid')?.value)>0))return;const u=worker.querySelector('.unpaid'),old=num(u?.value);if(old>0){const last=ss[ss.length-1]?.querySelector('.blockUnpaid');if(last){last.value=String(old);saveStored(worker)}}}
function calc(worker){const ss=segs(worker).filter(s=>s.querySelector('.start')?.value||s.querySelector('.finish')?.value||s.querySelector('.qty')?.value||s.querySelector('.blk')?.value);if(!ss.length)return;const pre=num(worker.querySelector('.pre')?.value),smoko=num(worker.querySelector('.smoko')?.value);ss.forEach((seg,i)=>{let box=seg.querySelector('.segAvg');if(!box){box=d.createElement('div');box.className='segAvg';seg.appendChild(box)}const raw=elapsed(seg.querySelector('.start')?.value,seg.querySelector('.finish')?.value),move=num(seg.querySelector('.movement')?.value),unpaid=num(seg.querySelector('.blockUnpaid')?.value);let deduct=move+unpaid;if(i===0)deduct+=pre+smoko;const netMin=Math.max(0,raw-deduct),net=netMin/60,qty=num(seg.querySelector('.qty')?.value),rate=num(seg.querySelector('.rate')?.value),earn=qty*rate,avg=net>0?earn/net:null;box.innerHTML=`<span>BLOCK NET <b>${net.toFixed(2)}h</b></span><span>BLOCK EARN <b>${money(earn)}</b></span><span class="${avg==null?'':avg<30?'low':'good'}">BLOCK AVG <b>${avg==null?'-':money(avg)+'/HR'}</b></span>`})}
function refresh(){d=deepestDoc();if(!d?.body)return;style();const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP — FLEX v10';d.querySelectorAll('.worker').forEach(w=>{ensure(w);migrate(w);sync(w);calc(w)})}
function schedule(){clearTimeout(t);t=setTimeout(refresh,50)}
function enhance(){d=deepestDoc();if(!d?.body){setTimeout(enhance,250);return}refresh();if(!d.body.dataset.v10){d.body.dataset.v10='1';d.addEventListener('input',e=>{if(e.target.matches('.movement,.start,.finish,.qty,.rate,.pre,.smoko,.blockUnpaid'))schedule()},true);d.addEventListener('change',schedule,true);d.addEventListener('click',()=>setTimeout(refresh,120),true);new MutationObserver(()=>schedule()).observe(d.getElementById('workers')||d.body,{childList:true,subtree:true})}let n=0;const id=setInterval(()=>{refresh();if(++n>30)clearInterval(id)},300)}
outer.addEventListener('load',()=>setTimeout(enhance,500));setTimeout(enhance,900);
</script></body></html>
