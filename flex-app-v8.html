<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLL E TEAM COSTA APP — FLEX v8</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#app{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" src="flex-app-v7.html?v=8" title="PLL E TEAM COSTA APP FLEX"></iframe>
<script>
const frame=document.getElementById('app');let d=null,t=null;
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:0}
function hhmm(v){if(v===''||v==null)return null;let n=parseInt(v,10),h=Math.floor(n/100),m=n%100;if(h<0||h>23||m<0||m>59)return null;return h*60+m}
function elapsed(s,f){s=hhmm(s);f=hhmm(f);if(s==null||f==null)return 0;let x=f-s;if(x<0)x+=1440;return x}
function money(n){return '$'+(Number(n)||0).toFixed(2)}
function style(){if(d.getElementById('v8style'))return;const s=d.createElement('style');s.id='v8style';s.textContent=`
.segAvg{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:2px;padding-top:7px;border-top:1px dashed #ddd}.segAvg span{display:block;background:#eef2f7;border-radius:8px;padding:7px 8px;font-size:11px;font-weight:900}.segAvg .low{color:#b42318;background:#fff0f0}.segAvg .good{color:#128a35;background:#eefbf2}.segAvgNote{grid-column:1/-1;font-size:10px;color:#6b7280;margin-top:-2px}
@media(max-width:700px){.segAvg{grid-template-columns:repeat(3,1fr)}.segAvg span{font-size:10px;padding:6px 5px}}
`;d.head.appendChild(s)}
function workerSegs(worker){return [...worker.querySelectorAll('.seg')].filter(seg=>{const start=seg.querySelector('.start')?.value,finish=seg.querySelector('.finish')?.value,qty=seg.querySelector('.qty')?.value,blk=seg.querySelector('.blk')?.value;return start||finish||qty||blk})}
function patchWorker(worker){const segs=workerSegs(worker);if(!segs.length)return;const pre=num(worker.querySelector('.pre')?.value),smoko=num(worker.querySelector('.smoko')?.value),unpaid=num(worker.querySelector('.unpaid')?.value);segs.forEach((seg,i)=>{let box=seg.querySelector('.segAvg');if(!box){box=d.createElement('div');box.className='segAvg';seg.appendChild(box)}const raw=elapsed(seg.querySelector('.start')?.value,seg.querySelector('.finish')?.value);const move=num(seg.querySelector('.movement')?.value);let deduct=move;if(i===0)deduct+=pre+smoko;if(i===segs.length-1)deduct+=unpaid;const netMin=Math.max(0,raw-deduct),net=netMin/60;const qty=num(seg.querySelector('.qty')?.value),rate=num(seg.querySelector('.rate')?.value);const earn=qty*rate,avg=net>0?earn/net:null;box.innerHTML=`<span>BLOCK NET <b>${net.toFixed(2)}h</b></span><span>BLOCK EARN <b>${money(earn)}</b></span><span class="${avg==null?'':avg<30?'low':'good'}">BLOCK AVG <b>${avg==null?'-':money(avg)+'/HR'}</b></span><div class="segAvgNote">Block 1 deducts PRESTART + SMOKO. Each block deducts its own MOVEMENT. Day UNPAID is allocated to the last active block for the block-by-block average.</div>`})}
function refresh(){if(!d)return;d.querySelectorAll('.worker').forEach(patchWorker)}
function schedule(){clearTimeout(t);t=setTimeout(refresh,30)}
function enhance(){try{d=frame.contentDocument;if(!d?.body){setTimeout(enhance,200);return}style();const h=d.querySelector('header');if(h)h.textContent='PLL E TEAM COSTA APP — FLEX v8';if(!d.body.dataset.v8){d.body.dataset.v8='1';d.addEventListener('input',schedule,true);d.addEventListener('change',schedule,true);d.addEventListener('click',()=>setTimeout(refresh,100),true);const mo=new MutationObserver(()=>schedule());mo.observe(d.getElementById('workers')||d.body,{childList:true,subtree:true})}refresh();let n=0;const id=setInterval(()=>{refresh();if(++n>20)clearInterval(id)},250)}catch(e){console.error(e);setTimeout(enhance,400)}}
frame.addEventListener('load',()=>setTimeout(enhance,250));
</script></body></html>
